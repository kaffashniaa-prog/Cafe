<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کافه روبیک — لاکچری</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
@import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
:root{--bg:#14100C;--card:#1E1813;--tx:#F5EAD8;--mut:#A08D75;--gold:#D4A64C;--gold2:#EFCB7F;--esp:#D4A64C;--line:#33291F}
*{box-sizing:border-box;margin:0;padding:0;font-family:Vazirmatn,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);padding-bottom:104px}
/* هدر شیشه‌ای تیره */
header{position:sticky;top:0;z-index:50;background:#14100CCC;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#14100C;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px #D4A64C55}
.hname{flex:1;font-weight:800;font-size:17px;letter-spacing:.5px}
.sicon{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#1E1813;font-size:16px;cursor:pointer}
.swrap{max-height:0;overflow:hidden;transition:.3s;padding:0 14px}
.swrap.open{max-height:56px;padding-bottom:10px}
.swrap input{width:100%;border:1px solid var(--line);background:#1E1813;border-radius:999px;padding:11px 16px;font-family:inherit;font-size:14px;outline:none;color:var(--tx)}
.swrap input:focus{border-color:var(--gold)}
/* هیرو لاکچری */
.hero{margin:14px;border-radius:28px;padding:30px 22px;text-align:center;position:relative;overflow:hidden;
 background:radial-gradient(120% 100% at 50% 0%,#5A3E1C 0%,#2B1E10 45%,#14100C 100%)}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(#EFCB7F22 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(#0002,transparent 60%)}
.hero .star{font-size:13px;letter-spacing:6px;color:var(--gold)}
.hero h1{font-size:34px;font-weight:800;margin-top:10px;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:6px;font-size:13.5px;color:var(--mut)}
.cta{margin-top:18px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#14100C;border:0;border-radius:999px;padding:14px 30px;font-family:inherit;font-size:14.5px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px #D4A64C44;transition:.2s}
.cta:active{transform:scale(.96)}
/* بنر */
.bwrap{margin:0 14px;border-radius:22px;overflow:hidden;position:relative;box-shadow:0 8px 22px #00000066}
.btrack{display:flex;transition:transform .45s cubic-bezier(.2,.8,.3,1)}
.bslide{flex:0 0 100%;padding:18px 20px;color:#14100C;min-height:96px;display:flex;flex-direction:column;justify-content:center}
.bslide b{font-size:16.5px;font-weight:800}
.bslide span{font-size:12.5px;opacity:.8;margin-top:4px}
.be{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:40px;opacity:.85}
.bdots{position:absolute;bottom:9px;right:0;left:0;display:flex;gap:5px;justify-content:center}
.bdots i{width:6px;height:6px;border-radius:99px;background:#14100C33;transition:.3s}
.bdots i.on{width:16px;background:#14100C}
/* چیپ‌ها */
.chipsbar{position:sticky;top:59px;z-index:40;background:linear-gradient(var(--bg) 82%,transparent);padding:10px 14px 8px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;transition:.25s}
.chip.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#14100C;border-color:transparent;box-shadow:0 4px 14px #D4A64C44}
h2.sec{font-size:17px;font-weight:800;margin:18px 16px 12px;position:relative;padding-right:12px}
h2.sec::before{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);width:4px;height:18px;border-radius:99px;background:linear-gradient(var(--gold),var(--gold2))}
/* منو کارتی */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 6px 16px #00000055;cursor:pointer;transition:.2s;animation:rise .5s both}
.card:active{transform:scale(.97)}
.ph{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative}
.ph .em{font-size:56px;filter:drop-shadow(0 8px 14px #000a)}
.ph::after{content:'';position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 15%,transparent 40%,#00000040 100%)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.bj{position:absolute;top:9px;right:9px;z-index:3;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;backdrop-filter:blur(4px)}
.b-b{background:#D4A64Cee;color:#14100C}.b-n{background:#2E7D32ee;color:#fff}.b-s{background:#B33A3Aee;color:#fff}
.cb{padding:11px 12px 13px}
.cb b{font-size:14.5px;font-weight:800;display:block}
.cb span{display:block;font-size:11.5px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.cp b{color:var(--gold2);font-size:14px;font-weight:800}
.cp small{font-size:10px;color:var(--mut)}
.msec{scroll-margin-top:118px}
/* شیت */
.ov{position:fixed;inset:0;background:#00000099;backdrop-filter:blur(3px);z-index:55;opacity:0;transition:.3s}
.ov.on{opacity:1}
.sheet{position:fixed;right:0;left:0;bottom:0;z-index:60;background:var(--card);border-radius:26px 26px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom));max-width:540px;margin:auto;transform:translateY(105%);transition:.32s cubic-bezier(.2,.8,.3,1)}
.sheet.on{transform:none}
.sh-grip{width:44px;height:5px;border-radius:99px;background:#3A2F24;margin:0 auto 14px}
.sh-ph{aspect-ratio:16/9;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.sh-ph .em{font-size:74px;filter:drop-shadow(0 10px 16px #000a)}
.sh-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.sh-top{display:flex;align-items:flex-start;gap:10px;margin-top:14px}
.sh-top b{font-size:19px;font-weight:800}
.sh-top span{font-size:13px;color:var(--mut);margin-top:3px;display:block}
.sh-x{margin-right:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#14100C;font-size:14px;cursor:pointer;flex:0 0 34px;color:var(--tx)}
.sh-price{margin-top:16px;background:linear-gradient(135deg,#D4A64C1f,#EFCB7F14);border:1px solid #D4A64C40;border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.sh-price b{font-size:19px;font-weight:800;color:var(--gold2)}
.sh-price span{font-size:12.5px;color:var(--mut)}
/* داک */
.dock{position:fixed;right:16px;left:16px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;display:flex;border-radius:22px;background:#1E1813F0;border:1px solid var(--line);backdrop-filter:blur(16px);padding:8px;box-shadow:0 12px 32px #00000080}
.dock button{flex:1;background:none;border:0;color:#A08D75;font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;padding:8px 0;border-radius:16px;transition:.25s}
.dock button .e{display:block;font-size:21px;margin-bottom:3px}
.dock button.on{background:#D4A64C1f;color:var(--gold2)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px}
footer{text-align:center;color:#6B5C49;font-size:11px;padding:28px 0 12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="logo">R</div>
    <div class="hname">کافه روبیک</div>
    <button class="sicon" onclick="togSearch()">🔍</button>
  </div>
  <div class="swrap" id="swrap"><input id="sinput" placeholder="جستجو در منو… مثلاً لاته" oninput="search()"></div>
</header>

<div class="hero">
  <div class="star">★ ★ ★</div>
  <h1>کافه روبیک</h1>
  <p>تجربه‌ای لاکچری از قهوه و طعم</p>
  <button class="cta" onclick="goMenu()">مشاهده منو ✨</button>
</div>

<div class="bwrap" id="bwrap"><div class="btrack" id="btrack"></div><div class="bdots" id="bdots"></div></div>
<div class="chipsbar" id="chipsbar"><div class="chips" id="chips"></div></div>

<div id="menu"></div>
<div id="results" hidden><h2 class="sec">🔍 نتایج جستجو</h2><div class="grid" id="rrows"></div><div class="empty" id="nores" hidden>😅 چیزی پیدا نشد</div></div>

<footer>کافه روبیک © ۱۴۰۴ — با ☕ و ❤️</footer>

<nav class="dock">
  <button class="on" onclick="dock(this,'home')"><span class="e">🏠</span>خانه</button>
  <button onclick="dock(this,'menu')"><span class="e">☕</span>منو</button>
  <button onclick="dock(this,'contact')"><span class="e">📞</span>تماس</button>
</nav>

<div class="ov" id="ov" onclick="closeSheet()" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="sh-grip"></div>
  <div class="sh-ph" id="sh-ph"><span class="em">☕</span></div>
  <div class="sh-top"><div><b id="sh-name"></b><span id="sh-desc"></span></div><button class="sh-x" onclick="closeSheet()">✕</button></div>
  <div class="sh-price"><span>قیمت</span><b id="sh-price"></b></div>
</div>

<script>
const CATS=[['قهوه','☕ قهوه‌ها'],['سوم','🌊 موج سوم'],['گرم','🍯 گرم‌نوش'],['خوراک','🍽️ خوراک'],['کیک','🍰 کیک روز'],['سرد','🥤 سردنوش']];
/* گرادیان‌های لاکچری تیره — جاش عکس واقعی می‌شینه بعداً */
const G={
 esp:'linear-gradient(150deg,#8A6234,#2B1B0D)',ame:'linear-gradient(150deg,#6B4A2E,#241509)',
 lat:'linear-gradient(150deg,#C99B5A,#5E3A18)',cap:'linear-gradient(150deg,#D8B283,#6E4420)',
 che:'linear-gradient(150deg,#B58B5D,#452A14)',syp:'linear-gradient(150deg,#9C703C,#3A2310)',
 fre:'linear-gradient(150deg,#96633A,#33200E)',mas:'linear-gradient(150deg,#B5773A,#4A2A10)',
 hot:'linear-gradient(150deg,#7A4E22,#2E1A08)',las:'linear-gradient(150deg,#A84624,#54200A)',
 pan:'linear-gradient(150deg,#B9813F,#543314',bur:'linear-gradient(150deg,#9C4E1F,#4A240C)',
 cak:'linear-gradient(150deg,#6E4520,#2B1707)',tre:'linear-gradient(150deg,#D9BE93,#8A6234)',
 car:'linear-gradient(150deg,#C07C38,#5E3712',moj:'linear-gradient(150deg,#5E8C52,#24401F)',
 shk:'linear-gradient(150deg,#6E4425,#2E1A0C)'};
const ITEMS=[
 ['قهوه','☕','اسپرسو','شات خالص و غلیظ ایتالیایی',85000,'b|⭐ پرفروش',G.esp],
 ['قهوه','☕','آمریکانو','اسپرسو با آب داغ، تلخ و خوش‌عطر',95000,'',G.ame],
 ['قهوه','🥛','لاته','شیر بخارپز با لایه‌ی ابریشمی',110000,'b|⭐ پرفروش',G.lat],
 ['قهوه','🧋','کاپوچینو','تعادل کامل اسپرسو و فوم شیر',105000,'',G.cap],
 ['سوم','🌊','شیمکس','دم‌آوری آرام با طعم میوه‌ای',140000,'',G.che],
 ['سوم','⚗️','سیفون','قهوه تئاتری با بدنه شفاف',150000,'n|🆕 جدید',G.syp],
 ['سوم','🫖','فرنچ پرس','دم‌آوری کلاسیک با بدنه پر',120000,'',G.fre],
 ['گرم','🍯','ماسالا چای','چای هندی با شیر و ادویه',120000,'',G.mas],
 ['گرم','🍫','هات چاکلت','شکلات داغ غلیظ و خامه‌ای',130000,'n|🆕 جدید',G.hot],
 ['خوراک','🍝','لازانیا','لایه‌های گوشت و پنیر در فر',245000,'b|⭐ پرفروش',G.las],
 ['خوراک','🥪','پنینی','نان گریل با پنیر و مرغ',195000,'',G.pan],
 ['خوراک','🍔','برگر روبیک','برگر مخصوص با سس خانه',280000,'s|🔥 ویژه',G.bur],
 ['کیک','🍰','کیک شکلات','شکلات بلژیکی خیس و لذیذ',125000,'s|🔥 ویژه',G.cak],
 ['کیک','🍮','ترس‌لچس','کیک شیری سه‌لایه محبوب',140000,'b|⭐ پرفروش',G.tre],
 ['کیک','🧁','کیک هویج','هویج و گردو با فراستینگ',120000,'',G.car],
 ['سرد','🍹','موهیتو','نعنای تازه با لیمو و سودا',115000,'b|⭐ پرفروش',G.moj],
 ['سرد','🥤','شیک شکلات','شیک غلیظ با بستنی وانیلی',165000,'',G.shk]];
const BANNERS=[
 ['☕','صبحانه تا ۱۱ صبح','با تخفیف ویژه صبحانه‌خورها','linear-gradient(135deg,#EFCB7F,#D4A64C)'],
 ['🎉','قهوه دوم نصف‌قیمت','هر روز از ۴ تا ۶ عصر','linear-gradient(135deg,#D9BE93,#B58B5D)'],
 ['🥐','کیک تازه امروز','از فر مخصوص دسرها — محدود!','linear-gradient(135deg,#E8C89A,#C08B4E)']];
const fa=n=>n.toLocaleString('fa-IR');const $=id=>document.getElementById(id);
/* بنرها */
const bt=$('btrack'),bd=$('bdots');let bi=0,bTimer;
BANNERS.forEach((b,i)=>{const s=document.createElement('div');s.className='bslide';s.style.background=b[3];
 s.innerHTML=`<b>${b[0]} ${b[1]}</b><span>${b[2]}</span><div class="be">${b[0]}</div>`;bt.appendChild(s);
 const d=document.createElement('i');if(!i)d.className='on';d.onclick=()=>{showB(i);reArm();};bd.appendChild(d);});
function showB(n){bi=(n+BANNERS.length)%BANNERS.length;bt.style.transform=`translateX(${bi*100}%)`;
 [...bd.children].forEach((d,i)=>d.classList.toggle('on',i===bi));}
function reArm(){clearInterval(bTimer);bTimer=setInterval(()=>showB(bi+1),4000);}
reArm();
function card(it,i,delay){const[c,e,n,d,p,bg,g]=it;const el=document.createElement('div');el.className='card';el.style.animationDelay=delay+'ms';
 el.innerHTML=`<div class="ph" style="background:${g}"><span class="em">${e}</span>${bg?`<i class="bj b-${bg[0]}">${bg.slice(2)}</i>`:''}</div>
 <div class="cb"><b>${n}</b><span>${d}</span><div class="cp"><small>تومان</small><b>${fa(p)}</b></div></div>`;
 el.onclick=()=>openItem(i);return el;}
CATS.forEach(([id,lbl])=>{const s=document.createElement('section');s.className='msec';s.id='sec-'+id;
 s.innerHTML='<h2 class="sec">'+lbl+'</h2><div class="grid"></div>';$('menu').appendChild(s);
 let j=0;ITEMS.forEach((it,i)=>{if(it[0]===id){s.querySelector('.grid').appendChild(card(it,i,j*50));j++;}});});
CATS.forEach(([id,lbl])=>{const c=document.createElement('div');c.className='chip';c.textContent=lbl;
 c.onclick=()=>{$('sec-'+id).scrollIntoView({behavior:'smooth'});};$('chips').appendChild(c);});
function togSearch(){const w=$('swrap');w.classList.toggle('open');if(w.classList.contains('open'))$('sinput').focus();else{$('sinput').value='';search();}}
function search(){const q=$('sinput').value.trim();
 if(!q){$('results').hidden=true;$('bwrap').style.display='';$('chipsbar').style.display='';$('menu').querySelectorAll('.msec').forEach(s=>s.hidden=false);return;}
 $('bwrap').style.display='none';$('chipsbar').style.display='none';$('menu').querySelectorAll('.msec').forEach(s=>s.hidden=true);
 $('results').hidden=false;const rr=$('rrows');rr.innerHTML='';let n=0;
 ITEMS.forEach((it,i)=>{if((it[2]+it[3]).includes(q)){n++;rr.appendChild(card(it,i,n*50));}});
 $('nores').hidden=n>0;}
function openItem(i){const[c,e,n,d,p,bg,g]=ITEMS[i];
 $('sh-ph').style.background=g;$('sh-ph').innerHTML=`<span class="em">${e}</span>`;
 $('sh-name').textContent=n;$('sh-desc').textContent=d;$('sh-price').textContent=fa(p)+' تومان';
 $('ov').hidden=false;$('sheet').hidden=false;requestAnimationFrame(()=>{$('ov').classList.add('on');$('sheet').classList.add('on');});}
function closeSheet(){$('ov').classList.remove('on');$('sheet').classList.remove('on');setTimeout(()=>{$('ov').hidden=true;$('sheet').hidden=true;},320);}
let sy=0;$('sheet').addEventListener('touchstart',e=>sy=e.touches[0].clientY);
$('sheet').addEventListener('touchmove',e=>{if(e.touches[0].clientY-sy>70)closeSheet();});
const spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const id=e.target.id.replace('sec-','');
 document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.textContent===CATS.find(x=>x[0]===id)[1]));}}),{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('#menu .msec').forEach(s=>spy.observe(s));
function dock(b,w){document.querySelectorAll('.dock button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 if(w==='home')window.scrollTo({top:0,behavior:'smooth'});
 if(w==='menu')$('sec-قهوه').scrollIntoView({behavior:'smooth'});
 if(w==='contact')alert('📞 تماس: به‌زودی شماره واقعی اینجا قرار می‌گیره');}
function goMenu(){$('sec-قهوه').scrollIntoView({behavior:'smooth'});}
let bx=0;$('bwrap').addEventListener('touchstart',e=>bx=e.touches[0].clientX);
$('bwrap').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-bx;if(Math.abs(dx)>40){showB(bi+(dx>0?1:-1));reArm();}});
</script>
</body>
</html>
