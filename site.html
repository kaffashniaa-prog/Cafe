<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کافه روبیک</title>

<style>
@import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
:root{--bg:#F6F1E8;--card:#fff;--tx:#241A12;--mut:#8A7A6A;--or:#E8641C;--or2:#F09A4B;--esp:#241A12;--line:#EAE0D2}
*{box-sizing:border-box;margin:0;padding:0;font-family:Vazirmatn,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);padding-bottom:104px}
header{position:sticky;top:0;z-index:50;background:#FAF6EFCC;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{width:38px;flex:0 0 38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px #E8641C40}
.hname{flex:1;font-weight:800;font-size:17px}
.sicon{width:38px;flex:0 0 38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
.swrap{max-height:0;overflow:hidden;transition:.3s;padding:0 14px}
.swrap.open{max-height:56px;padding-bottom:10px}
.swrap input{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 16px;font-family:inherit;font-size:14px;outline:none}
.swrap input:focus{border-color:var(--or2)}
.hero{margin:14px;border-radius:28px;padding:26px 22px;background:radial-gradient(120% 90% at 85% 0%,#FFD9A8 0%,transparent 50%),radial-gradient(90% 80% at 5% 100%,#F2A65E2e 0%,transparent 55%),linear-gradient(135deg,#FFF8EE,#FBE7CF)}
.badge{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;box-shadow:0 3px 10px #7B5B4218}
.hero h1{font-size:31px;font-weight:800;line-height:1.35;margin-top:14px}
.hero p{margin-top:6px;font-size:13.5px;:var(--mut);color:var(--mut)}
.cta{margin-top:16px;background:var(--esp);color:#F6F1E8;border:0;border-radius:999px;padding:13px 24px;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px #241A1233;transition:.2s}
.cta:active{transform:scale(.96)}
/* اطلاعیه مثل Lago */
.notice{margin:0 14px 12px;background:#FFF4E2;border:1px solid #F5D9AE;border-radius:16px;padding:12px 14px;font-size:12.5px;color:#8A5A1B;display:flex;gap:9px;align-items:center}
/* چیپ‌ها */
.chipsbar{position:sticky;top:59px;z-index:40;background:linear-gradient(var(--bg) 82%,transparent);padding:10px 14px 8px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;transition:.25s}
.chip.on{background:var(--esp);color:#F6F1E8;border-color:var(--esp);box-shadow:0 4px 12px #241A1233}
h2.sec{font-size:17px;font-weight:800;margin:18px 16px 12px}
/* منو: گرید عکس‌دار مثل Lago */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 6px 16px #7B5B4215;cursor:pointer;transition:.2s;animation:rise .5s both;display:flex;flex-direction:column}
.card:active{transform:scale(.97)}
.ph{aspect-ratio:1/1;position:relative;background:#F0E6D6}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.bj{position:absolute;top:9px;right:9px;z-index:2;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;backdrop-filter:blur(4px);color:#fff}
.b-b{background:#E8641Cdd}.b-n{background:#2E7D32dd}.b-s{background:#C62828dd}
.cb{padding:11px 12px 13px}
.cb b{font-size:14.5px;font-weight:800;display:block}
.cb span{display:block;font-size:11.5px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.cp b{color:var(--or);font-size:14px;font-weight:800}
.cp small{font-size:10px;color:var(--mut)}
.msec{scroll-margin-top:118px}
/* شیت جزئیات */
.ov{position:fixed;inset:0;background:#241A1266;backdrop-filter:blur(3px);z-index:55;opacity:0;transition:.3s}
.ov.on{opacity:1}
.sheet{position:fixed;right:0;left:0;bottom:0;z-index:60;background:#fff;border-radius:26px 26px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom));max-width:540px;margin:auto;transform:translateY(105%);transition:.32s cubic-bezier(.2,.8,.3,1)}
.sheet.on{transform:none}
.sh-grip{width:44px;height:5px;border-radius:99px;background:#E4D8C8;margin:0 auto 14px}
.sh-ph{aspect-ratio:16/9;border-radius:18px;position:relative;overflow:hidden;background:#F0E6D6}
.sh-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.sh-top{display:flex;align-items:flex-start;gap:10px;margin-top:14px}
.sh-top b{font-size:19px;font-weight:800}
.sh-top span{font-size:13px;color:var(--mut);margin-top:3px;display:block}
.sh-x{margin-right:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:14px;cursor:pointer;flex:0 0 34px}
.sh-price{margin-top:16px;background:#FBEFE2;border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.sh-price b{font-size:19px;font-weight:800;color:var(--or)}
.sh-price span{font-size:12.5px;color:real;color:var(--mut)}
/* داک */
.dock{position:fixed;right:16px;left:16px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;display:flex;border-radius:22px;background:#241A12F0;backdrop-filter:blur(16px);padding:8px;box-shadow:0 12px 32px #241A1240}
.dock button{flex:1;background:none;border:0;color:#B9A890;font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;padding:8px 0;border-radius:16px;transition:.25s}
.dock button .e{display:block;font-size:21px;margin-bottom:3px}
.dock button.on{background:#ffffff14;color:#FFD9A8}
@keyframes rise{from{opacity:0;froxform:translateY(14px);opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.empty{text-align:center;color:var(--keyframes}}.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px}
footer{text-align:center;color:#A7988A;font-size:11px;padding:28px 0 12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
