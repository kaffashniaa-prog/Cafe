<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<title>سفارش‌گیری کافه روبیک</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<link rel="manifest" href='data:application/manifest+json,{"name":"Cafe Rubik","short_name":"Cafe","start_url":".","display":"standalone","background_color":"%230b0b0b","theme_color":"%230b0b0b"}'>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--text);padding-bottom:120px;transition:background .3s,color .3s}
.theme-dark{--bg:#0b0b0b;--panel:#161616;--card:#1f1f1f;--text:#f2ede6;--muted:#a39a90;--accent:#f5872e;--accentText:#1a120c;--line:#2d2d2d;--good:#4caf7d;--bad:#e0705c;--soft:rgba(245,135,46,.14)}
.theme-light{--bg:#f7f3ee;--panel:#efe6dc;--card:#ffffff;--text:#2b211b;--muted:#7c6f64;--accent:#c96d32;--accentText:#ffffff;--line:#e7ddd2;--good:#2e8f5e;--bad:#c4523c;--soft:rgba(201,109,50,.10)}
.theme-orange{--bg:#fff3e8;--panel:#ffe5d2;--card:#ffffff;--text:#3a2016;--muted:#80685a;--accent:#d85b24;--accentText:#ffffff;--line:#efc8b0;--good:#1d6e44;--bad:#a33418;--soft:rgba(216,91,36,.10)}
.theme-blue{--bg:#f2f6fa;--panel:#e6eef6;--card:#ffffff;--text:#172a3a;--muted:#65798b;--accent:#2f6f9f;--accentText:#ffffff;--line:#d2dee9;--good:#2e8f5e;--bad:#c4523c;--soft:rgba(47,111,159,.10)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--panel)}
header h1{font-size:1.05rem}
.hbtns{display:flex;gap:6px}
.hbtns button{border:none;background:var(--card);color:var(--text);border-radius:10px;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hbtns button.off{opacity:.45}
.hbtns svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#banner{display:none;position:fixed;top:10px;right:50%;transform:translateX(50%);z-index:90;background:var(--accent);color:var(--accentText);padding:10px 18px;border-radius:12px;font-weight:bold;font-size:.85rem;box-shadow:0 4px 18px rgba(0,0,0,.35);max-width:92vw;text-align:center}
#dash{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.75rem;color:var(--muted)}
.chip b{display:block;font-size:1.25rem;color:var(--accent);margin-top:2px}
nav{display:flex;gap:6px;padding:10px 12px;background:var(--panel);position:sticky;top:0;z-index:15;border-bottom:1px solid var(--line)}
nav button{flex:1;padding:11px 2px;border:none;border-radius:12px;background:var(--card);color:var(--text);font-family:inherit;font-size:.83rem;cursor:pointer}
nav button.active{background:var(--accent);color:var(--accentText);font-weight:bold}
main{padding:14px}
main section{display:none}
main section.show{display:block;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
button{font-family:inherit}
.act{border:none;border-radius:10px;padding:9px 14px;background:var(--accent);color:var(--accentText);font-weight:bold;cursor:pointer;font-size:.85rem}
.act.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.act.danger{background:var(--bad);color:#fff}
.act:active{transform:scale(.96)}
input,select{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-family:inherit;font-size:.9rem;width:100%}
.muted{color:var(--muted);font-size:.85rem}
h3{font-size:.95rem;margin:18px 0 8px;color:var(--accent)}
#tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.tcard{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px 8px 12px;text-align:center;cursor:pointer;overflow:hidden;transition:transform .1s}
.tcard:active{transform:scale(.95)}
.tcard::before{content:'';position:absolute;top:0;right:0;left:0;height:5px;background:var(--good);opacity:.7}
.tcard .tn{font-size:1.05rem;font-weight:bold;margin-top:6px}
.tcard .ts{font-size:.72rem;color:var(--muted);margin-top:4px}
.tcard.occ{background:var(--soft);border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tcard.occ::before{background:var(--accent);opacity:1}
.tcard.occ .ts{color:var(--accent);font-weight:bold}
#searchWrap{display:none;gap:6px;margin-bottom:10px}
#searchWrap.open{display:flex}
#catCircles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.circ{width:82px;height:82px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;text-align:center;font-size:.72rem;padding:6px;cursor:pointer;line-height:1.3}
.circ.active{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:bold;box-shadow:0 3px 12px var(--soft)}
.mitem{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.mitem .nm{font-weight:bold;font-size:.92rem}
.mitem .pr{color:var(--accent);font-size:.85rem;margin-top:3px}
.mitem.sold{opacity:.5}
.qtybox{display:flex;align-items:center;gap:8px}
.qtybox button{width:32px;height:32px;border-radius:50%;border:none;background:var(--accent);color:var(--accentText);font-size:1.1rem;font-weight:bold;cursor:pointer}
.qtybox .qn{min-width:20px;text-align:center;font-weight:bold;color:var(--accent)}
.badge{display:inline-block;background:var(--bad);color:#fff;border-radius:8px;padding:2px 8px;font-size:.7rem}
.oc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.oc .oh{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted)}
.oc .oh b{color:var(--text);font-size:.9rem}
.oc .ol{margin:8px 0;font-size:.85rem;line-height:1.9}
.oc .ot{font-weight:bold;color:var(--accent);border-top:1px dashed var(--line);padding-top:8px;font-size:.9rem}
.oc .warn{color:var(--bad);font-weight:bold}
.obtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.obtns button{flex:1;min-width:80px}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;gap:8px;font-size:.88rem}
.row .btns{display:flex;gap:4px}
.mini{border:none;border-radius:8px;padding:6px 10px;background:var(--soft);color:var(--accent);font-weight:bold;cursor:pointer;font-size:.75rem}
.mini.rd{color:var(--bad)}
.frm{display:flex;gap:6px;margin:8px 0}
#cartBar{display:none;position:fixed;bottom:12px;right:12px;left:12px;z-index:40;background:var(--accent);color:var(--accentText);border-radius:16px;padding:14px;font-weight:bold;font-size:.95rem;text-align:center;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#cartBar:active{transform:scale(.98)}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.ov.center{align-items:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px;animation:up .22s}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.loginBox{background:var(--bg);border-radius:20px;padding:24px;width:88%;max-width:360px;text-align:center}
.loginBox input{text-align:center;font-size:1.4rem;letter-spacing:8px;margin:14px 0}
.repRow{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:.82rem}
.repRow.click{cursor:pointer}
.filterTag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);border-radius:10px;padding:4px 10px;font-size:.75rem;font-weight:bold;margin:2px;cursor:pointer}
</style>
</head>
<body class="theme-dark">
<header>
  <h1>کافه روبیک</h1>
  <div class="hbtns">
    <button id="soundTgl" title="صدا"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button id="themeTgl" title="تم"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18c1.5 0 2-.8 2-1.6 0-1.4-1.3-1.6-1.3-2.9 0-1 .8-1.5 2-1.5h1.6c1.9 0 3.7-1.6 3.7-4.1A8 8 0 0 0 12 3z"/></svg></button>
    <button id="exitBtn" title="خروج"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
  </div>
</header>
<div id="banner"></div>
<div id="dash"></div>
<nav id="nav"></nav>
<main>
  <section id="s-tables"><div id="chips"></div><div id="tgrid"></div></section>
  <section id="s-menu">
    <div id="searchWrap"><input id="searchInp" placeholder="جستجو در کل منو..."><button class="act ghost" id="searchClose">بستن</button></div>
    <div style="display:flex;justify-content:flex-start;margin-bottom:8px"><button class="mini" id="searchTgl">جستجو</button></div>
    <div id="catCircles"></div>
    <div id="menuList"></div>
  </section>
  <section id="s-orders"><div id="ordersList"></div></section>
  <section id="s-admin">
    <h3>کارکنان (هر نفر یک کد)</h3>
    <div id="staffList"></div>
    <div class="frm"><input id="staffName" placeholder="اسم کارمند"><input id="staffPin" placeholder="کدش" inputmode="numeric"><button class="act" id="addStaffBtn">افزودن</button></div>
    <h3>کدهای ورود</h3>
    <button class="act ghost" id="chPinBtn">تغییر کد مدیر</button>
    <h3>مدیریت منو</h3>
    <div id="mngArea"></div>
    <h3>پایان روز</h3>
    <button class="act" id="endDayBtn" style="width:100%">پایان روز کاری و ثبت گزارش</button>
  </section>
  <section id="s-report">
    <div id="repSum"></div>
    <h3>جزئیات سفارش‌های امروز</h3>

    <button class="act ghost" id="repDetBtn" style="width:100%"></button>
    <div id="repDetList" style="display:none"></div>
    <h3>گزارش روزهای قبل (آرشیو)</h3>
    <div id="repArc"></div>
    <button class="act danger" id="purgeBtn" style="width:100%;margin-top:12px">حذف آرشیوهای قدیمی‌تر از ۳۰ روز</button>
  </section>
</main>
<div id="cartBar"></div>
<div class="ov" id="cartOv"><div class="sheet" id="cartSheet"></div></div>
<div class="ov" id="tableOv"><div class="sheet" id="tableSheet"></div></div>
<div class="ov" id="editOv"><div class="sheet" id="editSheet"></div></div>
<div class="ov" id="themeOv"><div class="loginBox" id="themeBox"></div></div>
<div class="ov center show" id="loginOv"><div class="loginBox">
  <h2 style="font-size:1.1rem">ورود به کافه روبیک</h2>
  <p class="muted" style="margin-top:6px">کد ورود را وارد کنید</p>
  <input id="loginPin" inputmode="numeric" maxlength="8" placeholder="----">
  <div id="loginErr" style="color:var(--bad);font-size:.8rem;min-height:18px;margin-top:6px"></div>
  <button class="act" id="loginBtn" style="width:100%">ورود</button>
</div></div>
<script>
const SUPA_URL='https://dkmgewadohmnspkueodi.supabase.co';
const SUPA_KEY='sb_publishable_1IKt1YXof1LUaVeM5VDgpQ_vb8QqjnJ';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const $=s=>document.querySelector(s);
const TABLE_COUNT=15;
let role=localStorage.getItem('cafeRole')||'';
let userName=localStorage.getItem('cafeUser')||'';
let soundOn=localStorage.getItem('cafeSoundOn')!=='0';
let adminPin='1396',extraCats=[],staffPinLegacy='';
let menuRows=[],orders=[],staffList=[];
let cart=[],currentCat=null,currentTable=null;
let editId=null,editItems=[],repFilter={who:null,table:null},repDetOpen=false,arcOpenDay=null;
let prevStatus={},inited=false;
const fmt=n=>(n*1000).toLocaleString('fa-IR');
const hhmm=d=>new Date(d).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
const faDate=d=>new Date(d).toLocaleDateString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'});
function parseItems(o){try{return (JSON.parse(o.items||'[]')).map(it=>({name:it.name||it.n||'',price:Number(it.price!=null?it.price:(it.p!=null?it.p:0)),qty:Number(it.qty||it.q||1),note:it.note||it.t||''}));}catch(e){return[];}}
const orderTotal=o=>parseItems(o).reduce((s,it)=>s+it.qty*(it.price||0),0);
function showToast(msg){const b=$('#banner');b.textContent=msg;b.style.display='block';clearTimeout(b._t);b._t=setTimeout(()=>b.style.display='none',6000);}
function todayOrders(){const t=new Date().toDateString();return orders.filter(o=>o.created_at&&new Date(o.created_at).toDateString()===t);}
function activeOrders(){return orders.filter(o=>!o.archived&&o.status!=='done');}
let actx=null;
function ensureAudio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return false;}}if(actx.state==='suspended')actx.resume();return true;}
function tone(f,d,dur,vol){const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(vol||.6,actx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d+dur);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+dur+.05);}
function playSound(k){if(!soundOn||!ensureAudio())return;try{if(k==='new'){tone(880,0,.22);tone(1175,.2,.3);tone(1568,.42,.4,.5);}else{tone(988,0,.18);tone(784,.18,.18);tone(1319,.36,.45,.55);}}catch(e){}}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function setTheme(t){document.body.className='theme-'+t;localStorage.setItem('cafeTheme',t);}
function openTheme(){const box=$('#themeBox');box.innerHTML='<b style="font-size:.95rem">انتخاب تم</b><div style="display:grid;gap:8px;margin-top:12px">'
 +[['dark','مشکی-نارنجی','#0b0b0b'],['light','سفید کافه‌ای','#f7f3ee'],['orange','نارنجی شیک','#fff3e8'],['blue','آبی شیک','#f2f6fa']].map(x=>'<button class="act ghost" data-t="'+x[0]+'" style="display:flex;align-items:center;gap:10px;justify-content:flex-start"><span style="width:18px;height:18px;border-radius:50%;background:'+x[2]+';border:1px solid var(--line);display:inline-block"></span>'+x[1]+'</button>').join('')+'</div>';
 box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{setTheme(b.dataset.t);$('#themeOv').classList.remove('show');});
 $('#themeOv').classList.add('show');}
$('#themeOv').onclick=e=>{if(e.target.id==='themeOv')$('#themeOv').classList.remove('show');};
async function loadSettings(){try{const{data}=await sb.from('cafe_settings').select('*');(data||[]).forEach(r=>{if(r.key==='admin_pin')adminPin=r.value;try{if(r.key==='extra_cats')extraCats=JSON.parse(r.value||'[]');}catch(e){}});}catch(e){}}
async function loadStaff(){try{const{data}=await sb.from('cafe_staff').select('*').order('id');staffList=data||[];}catch(e){staffList=[];}}
async function loadMenu(){try{const{data}=await sb.from('cafe_menu').select('*').order('id');menuRows=data||[];if(role)renderCats(),renderMenuList();}catch(e){}}
async function fetchOrders(){try{const{data}=await sb.from('cafe_orders').select('*').order('id',{ascending:false}).limit(300);orders=data||[];
 if(inited){
   const seen=new Date(localStorage.getItem('cafeLastSeen')||0);
   const fresh=orders.filter(o=>o.status==='new'&&!o.archived&&o.who!==userName&&new Date(o.created_at)>seen);
   if(fresh.length){playSound('new');vib([250,120,250,120,250]);showToast(fresh.length+' سفارش جدید! '+(fresh.length<=3?fresh.map(o=>'میز '+o.table_id).join('، '):''));}
   orders.forEach(o=>{if(prevStatus[o.id]&&prevStatus[o.id]!=='done'&&o.status==='done'){playSound('done');vib([120,80,120]);showToast('سفارش میز '+o.table_id+' تحویل شد');}prevStatus[o.id]=o.status;});
 }
 const mx=orders.reduce((m,o)=>o.created_at&&new Date(o.created_at)>m?new Date(o.created_at):m,new Date(localStorage.getItem('cafeLastSeen')||0));
 localStorage.setItem('cafeLastSeen',mx.toISOString());
 if(inited){renderDash();renderTables();renderOrders();if(role==='admin'&&$('#s-report').classList.contains('show'))renderReport();}
}catch(e){}}
function buildNav(){const tabs=[['tables','میزها'],['menu','منو'],['orders','سفارش‌ها']];if(role==='admin'){tabs.push(['admin','مدیریت'],['report','گزارش']);}
 $('#nav').innerHTML=tabs.map(t=>'<button data-t="'+t[0]+'" class="'+($('#nav').dataset.cur===t[0]?'active':'')+'">'+t[1]+'</button>').join('');
 $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
 $('#dash').style.display=role?'grid':'none';}
function showTab(id){$('#nav').dataset.cur=id;document.querySelectorAll('main section').forEach(s=>s.classList.remove('show'));$('#s-'+id).classList.add('show');
 $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.t===id));
 if(id==='tables'){renderDash();renderTables();}if(id==='orders')renderOrders();if(id==='menu'){renderCats();renderMenuList();}if(id==='admin'&&role==='admin')renderAdmin();if(id==='report'&&role==='admin')renderReport();}
function renderDash(){const act=activeOrders();const occ=new Set(act.map(o=>o.table_id)).size;const sum=todayOrders().reduce((s,o)=>s+orderTotal(o),0);
 $('#dash').innerHTML='<div class="chip">میز آزاد<b>'+(TABLE_COUNT-occ)+'</b></div>'
 +'<div class="chip">میز اشغال<b>'+occ+'</b></div>'
 +'<div class="chip">سفارش فعال<b>'+act.length+'</b></div>'
 +'<div class="chip">فروش امروز<b>'+fmt(sum)+'</b></div>';}
function renderTables(){const act=activeOrders();const byT={};act.forEach(o=>{(byT[o.table_id]=byT[o.table_id]||[]).push(o);});
 let h='';for(let i=1;i<=TABLE_COUNT;i++){const list=(byT[i]||[]);const occ=list.length>0;
  let sub='آزاد';if(occ){const old=list.reduce((m,o)=>new Date(o.created_at)<m?new Date(o.created_at):m,new Date(list[0].created_at));const mins=Math.floor((Date.now()-old)/60000);sub=list.length+' سفارش · '+mins+' دقیقه';}
  h+='<div class="tcard'+(occ?' occ':'')+'" data-t="'+i+'"><div class="tn">میز '+i+'</div><div class="ts">'+sub+'</div></div>';}
 $('#tgrid').innerHTML=h;$('#tgrid').querySelectorAll('.tcard').forEach(c=>c.onclick=()=>{const t=+c.dataset.t;(byT[t]||[]).length?openTableSheet(t):startOrder(t);});}
function openTableSheet(t){const act=orders.filter(o=>!o.archived&&o.table_id===t);
 $('#tableSheet').innerHTML='<b>میز '+t+'</b><div style="margin:10px 0">'+(act.length?act.map(o=>'<div class="row"><span>'+hhmm(o.created_at)+' · '+parseItems(o).length+' آیتم · <b style="color:var(--accent)">'+fmt(orderTotal(o))+'</b> · '+(o.status==='new'?'جدید':'در حال آماده‌سازی')+'</span></div>').join(''):'<span class="muted">سفارش فعالی ندارد</span>')+'</div>'
 +'<div style="display:grid;gap:8px"><button class="act" id="tsAdd">سفارش جدید برای این میز</button>'
 +(orders.some(o=>o.table_id===t)?'<button class="act ghost" id="tsRep">تکرار سفارش قبلی این میز</button>':'')+'</div>';
 $('#tsAdd').onclick=()=>{$('#tableOv').classList.remove('show');startOrder(t);};
 const r=$('#tsRep');if(r)r.onclick=()=>{const last=orders.filter(o=>o.table_id===t).sort((a,b)=>b.id-a.id)[0];cart=parseItems(last);currentTable=t;$('#tableOv').classList.remove('show');showTab('menu');openCart();};
 $('#tableOv').classList.add('show');}

 const late=o.status!=='done'&&mins>=5;
 const btns=o.status==='new'?'<button class="act" data-act="prep" data-id="'+o.id+'">شروع آماده‌سازی</button>'
  :o.status==='preparing'?'<button class="act" data-act="done" data-id="'+o.id+'">تحویل شد</button>':'';

 +(late?'<div class="warn" style="font-size:.75rem;margin-top:4px">معطل '+mins+' دقیقه!</div>':'')

  $('#repDetList').querySelectorAll('.repRow').forEach(r=>r.onclick=()=>{repFilter.who=r.dataset.w;repFilter.table=r.dataset.t;renderReport();});}

 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const sc={};td.forEach(o=>{const w=o.who||'—';sc[w]=(sc[w]||0)+1;});
 let h='<div class="chip">سفارش امروز<b>'+td.length+'</b></div><div class="chip" style="margin-top:8px">فروش امروز<b>'+fmt(sum)+' تومان</b></div>';
 h+='<div class="muted" style="margin-top:10px">پرفروش‌ها: '+(top.length?top.map(x=>x[0]+' ('+x[1]+'×)').join(' · '):'—')+'</div>';
 h+='<div class="muted" style="margin-top:6px">کارکنان: '+(Object.keys(sc).length?Object.entries(sc).map(x=>x[0]+' '+x[1]).join(' · '):'—')+'</div>';
 $('#repSum').innerHTML=h;
 $('#repDetBtn').textContent=(repDetOpen?'بستن':'نمایش')+' جزئیات سفارش‌ها ('+td.length+')';
 $('#repDetBtn').onclick=()=>{repDetOpen=!repDetOpen;$('#repDetList').style.display=repDetOpen?'block':'none';renderReport();};
 $('#repFilters').innerHTML='';
 if(repDetOpen){const list=td.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  $('#repDetList').innerHTML=(list.length?'<div class="muted" style="margin-bottom:6px">برای ویرایش، روی هر سفارش بزن:</div>':'')+list.map(o=>'<div class="repRow click" data-oid="'+o.id+'"><span>'+hhmm(o.created_at)+' · میز '+o.table_id+(o.who?' · '+o.who:'')+'</span><b>'+fmt(orderTotal(o))+'</b></div>').join('')||'<div class="muted">سفارشی امروز ثبت نشده</div>';
  $('#repDetList').querySelectorAll('[data-oid]').forEach(r=>r.onclick=()=>addMore(+r.dataset.oid));}
 const arcs=orders.filter(o=>o.archived);const days={};arcs.forEach(o=>{const d=(o.archived_at||o.created_at||'').slice(0,10);(days[d]=days[d]||[]).push(o);});
 const dkeys=Object.keys(days).sort().reverse();
 $('#repArc').innerHTML=dkeys.length?dkeys.map(d=>{const L=days[d];const s2=L.reduce((x,o)=>x+orderTotal(o),0);
  const open=arcOpenDay===d;
  return '<div class="row" style="flex-direction:column;align-items:stretch"><div style="display:flex;justify-content:space-between;cursor:pointer" data-day="'+d+'"><span>روز '+faDate(d)+' — '+L.length+' سفارش</span><b style="color:var(--accent)">'+fmt(s2)+'</b></div>'
  +(open?'<div style="margin-top:8px">'+L.map(o=>'<div class="repRow click" data-oid="'+o.id+'"><span>'+hhmm(o.created_at)+' · میز '+o.table_id+(o.who?' · '+o.who:'')+'</span><b>'+fmt(orderTotal(o))+'</b></div>').join('')+'</div>':'')+'</div>';}).join(''):'<div class="muted">آرشیوی نیست</div>';
 $('#repArc').querySelectorAll('[data-day]').forEach(r=>r.onclick=()=>{arcOpenDay=arcOpenDay===r.dataset.day?null:r.dataset.day;renderReport();});
 $('#repArc').querySelectorAll('[data-oid]').forEach(r=>r.onclick=e=>{e.stopPropagation();addMore(+r.dataset.oid);});
 if(!$('#wipeTodayBtn')&&$('#purgeBtn')){const b=document.createElement('button');b.id='wipeTodayBtn';b.className='act danger';b.style.cssText='width:100%;margin-top:8px';b.textContent='حذف همه سفارش‌های امروز';b.onclick=wipeToday;$('#purgeBtn').parentNode.insertBefore(b,$('#purgeBtn'));}}
</script>
<script>
/* ===== پچ امروز ۱: پرداخت + انتقال میز + بیرون‌بر ===== */
const TAKEOUT=0;
function tblLabel(t){return t===TAKEOUT?'🥡 بیرون‌بر':'میز '+t;}
function markPaid(id){sb.from('cafe_orders').update({paid:true}).eq('id',id).then(()=>{showToast('💵 پرداخت ثبت شد');fetchOrders();});}
async function setStatus(id,st){const up={status:st};
 if(st==='preparing'&&userName)up.prepared_by=userName;
 if(st==='done'){if(userName)up.delivered_by=userName;const o=orders.find(x=>x.id===id);if(o&&o.table_id===TAKEOUT)up.archived=true,up.archived_at=new Date().toISOString();}
 await sb.from('cafe_orders').update(up).eq('id',id);fetchOrders();}
function startOrder(t){currentTable=t;cart=[];showToast((t===TAKEOUT?'🥡 سفارش بیرون‌بر':'میز '+t)+' انتخاب شد — سفارش بگیر');showTab('menu');}
function moveTable(fromT){const list=orders.filter(o=>!o.archived&&o.table_id===fromT&&o.status!=='done');if(!list.length){showToast('سفارش فعالی برای انتقال نیست');return;}
 const busy=new Set(tableOrders().filter(o=>o.status!=='done').map(o=>o.table_id));
 let h='<b>🔄 انتقال — به کدام میز؟</b><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px">';
 for(let i=1;i<=TABLE_COUNT;i++){if(i===fromT||busy.has(i))continue;h+='<button class="act ghost" data-mv="'+i+'">میز '+i+'</button>';}
 h+='</div><button class="act ghost" id="mvCancel" style="width:100%;margin-top:10px">انصراف</button>';
 $('#tableSheet').innerHTML=h;
 $('#tableSheet').querySelectorAll('[data-mv]').forEach(b=>b.onclick=async()=>{const to=+b.dataset.mv;
  await sb.from('cafe_orders').update({table_id:to}).in('id',list.map(o=>o.id));
  $('#tableOv').classList.remove('show');showToast('به میز '+to+' منتقل شد');fetchOrders();});
 $('#mvCancel').onclick=()=>openTableSheet(fromT);
 $('#tableOv').classList.add('show');}
function renderTables(){const occ=tableOrders();const byT={};occ.forEach(o=>{(byT[o.table_id]=byT[o.table_id]||[]).push(o);});
 const tk=(byT[TAKEOUT]||[]);
 let h='<div class="tcard'+(tk.length?' occ':'')+'" data-t="'+TAKEOUT+'" style="grid-column:1/-1;padding:10px"><div class="tn">🥡 سفارش بیرون‌بر</div><div class="ts">'+(tk.length?tk.length+' سفارش فعال':'—')+'</div></div>';
 for(let i=1;i<=TABLE_COUNT;i++){const list=(byT[i]||[]);const busy=list.length>0;
  let sub='آزاد';if(busy){const actN=list.filter(o=>o.status!=='done').length;const old=list.reduce((m,o)=>new Date(o.created_at)<m?new Date(o.created_at):m,new Date(list[0].created_at));const mins=Math.floor((Date.now()-old)/60000);sub=actN?(list.length+' سفارش · '+mins+' دقیقه'):('تحویل شد · '+mins+' دقیقه');}
  h+='<div class="tcard'+(busy?' occ':'')+'" data-t="'+i+'"><div class="tn">میز '+i+'</div><div class="ts">'+sub+'</div></div>';}
 $('#tgrid').innerHTML=h;
 $('#tgrid').querySelectorAll('.tcard').forEach(c=>c.onclick=()=>{const t=+c.dataset.t;(byT[t]||[]).length?openTableSheet(t):startOrder(t);});}
function doCloseTable(t,list){if(!list.length){$('#tableOv').classList.remove('show');return;}
 sb.from('cafe_orders').update({archived:true,archived_at:new Date().toISOString()}).in('id',list.map(o=>o.id)).then(()=>{$('#tableOv').classList.remove('show');showToast(tblLabel(t)+' بسته شد');fetchOrders();});}
function openTableSheet(t){const list=orders.filter(o=>!o.archived&&o.table_id===t).sort((a,b)=>b.id-a.id);
 const stLbl=s=>s==='new'?'جدید':(s==='preparing'?'در حال آماده‌سازی':'تحویل شد ✓');
 const tot=list.reduce((s,o)=>s+orderTotal(o),0);const paidSum=list.filter(o=>o.paid).reduce((s,o)=>s+orderTotal(o),0);
 const rows=list.map(o=>'<div class="row" style="flex-direction:column;align-items:stretch"><div style="display:flex;justify-content:space-between;gap:6px;font-size:.8rem"><span>'+hhmm(o.created_at)+' · '+parseItems(o).map(x=>x.name+'×'+x.qty).join('، ')+'</span><b style="white-space:nowrap">'+fmt(orderTotal(o))+'</b></div><div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:4px"><span style="font-size:.75rem">'+stLbl(o.status)+' · '+(o.paid?'<span style="color:var(--good)">✅ پرداخت شد</span>':'<span style="color:var(--bad)">🔶 مانده</span>')+'</span>'+(o.paid?'':'<button class="mini" data-pay="'+o.id+'">💵 پرداخت شد</button>')+'</div></div>').join('');
 const takeout=t===TAKEOUT;
 $('#tableSheet').innerHTML='<b>'+tblLabel(t)+'</b>'
 +(list.length?'<div class="muted" style="margin:8px 0">💵 پرداخت‌شده: '+fmt(paidSum)+' · ⏳ مانده: '+fmt(tot-paidSum)+'</div>':'')
 +'<div style="margin:8px 0">'+(rows||'<span class="muted">سفارشی ندارد</span>')+'</div>'
 +'<div style="display:grid;gap:8px"><button class="act" id="tsAdd">سفارش جدید</button>'
 +(orders.some(o=>o.table_id===t)?'<button class="act ghost" id="tsRep">تکرار سفارش قبلی</button>':'')
 +(!takeout&&list.length?'<button class="act ghost" id="tsMove">🔄 انتقال میز</button>':'')
 +(list.length?'<button class="act danger" id="tsFree">'+(takeout?'🧹 بستن (تحویل داده شد)':'مشتری رفت — بستن حساب')+'</button>':'')+'</div>';
 $('#tsAdd').onclick=()=>{$('#tableOv').classList.remove('show');startOrder(t);};
 const r=$('#tsRep');if(r)r.onclick=()=>{const last=orders.filter(o=>o.table_id===t).sort((a,b)=>b.id-a.id)[0];cart=parseItems(last);currentTable=t;$('#tableOv').classList.remove('show');showTab('menu');openCart();};
 const mv=$('#tsMove');if(mv)mv.onclick=()=>moveTable(t);
 const f=$('#tsFree');if(f)f.onclick=()=>{const unpaid=list.filter(o=>!o.paid);
  if(!unpaid.length){doCloseTable(t,list);return;}
  $('#tableSheet').innerHTML='<b>🧹 بستن حساب — '+tblLabel(t)+'</b><div class="muted" style="margin:8px 0">این سفارش‌ها هنوز پرداخت نشده:</div>'
  +unpaid.map(o=>'<div class="row"><span>#'+o.id+' · '+parseItems(o).map(x=>x.name+'×'+x.qty).join('، ')+'</span><span style="display:flex;gap:6px;align-items:center"><b>'+fmt(orderTotal(o))+'</b><button class="mini" data-pay="'+o.id+'">💵 پرداخت شد</button></span></div>').join('')
  +'<div style="display:grid;gap:8px;margin-top:10px"><button class="act" id="ckRefresh">بروزرسانی</button><button class="act danger" id="ckForce">بستن بدون تسویه</button></div>';
  $('#tableSheet').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>markPaid(+b.dataset.pay));
  $('#ckRefresh').onclick=()=>openTableSheet(t);
  $('#ckForce').onclick=()=>{if(confirm('مطمئنی؟ حساب پرداخت‌نشده می‌مونه!'))doCloseTable(t,orders.filter(o=>!o.archived&&o.table_id===t));};};
 $('#tableSheet').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>markPaid(+b.dataset.pay));
 $('#tableOv').classList.add('show');}
</script>
<script>
/* ===== پچ امروز ۲: چیپ تحویل‌شده‌ها + آمار کارکنان + تب پیام‌ها ===== */
function orderCard(o){const its=parseItems(o);const mins=Math.floor((Date.now()-new Date(o.created_at))/60000);
 const late=o.status!=='done'&&mins>=5;
 const btns=o.status==='new'?'<button class="act" data-act="prep" data-id="'+o.id+'">شروع آماده‌سازی</button>':o.status==='preparing'?'<button class="act" data-act="done" data-id="'+o.id+'">تحویل شد</button>':'';
 const who='<div class="muted" style="font-size:.72rem;margin-top:4px">📝 '+(o.who||'—')+(o.prepared_by?' · 🍳 '+o.prepared_by:'')+(o.delivered_by?' · ✅ '+o.delivered_by:'')+(o.paid?' · 💵':'')+'</div>';
 return '<div class="oc"><div class="oh"><b>سفارش #'+o.id+' · '+tblLabel(o.table_id)+'</b><span>'+hhmm(o.created_at)+'</span></div>'
 +(late?'<div class="warn" style="font-size:.75rem;margin-top:4px">معطل '+mins+' دقیقه!</div>':'')
 +'<div class="ol" style="display:block">'+its.map(itemLine).join('')+'</div>'
 +'<div class="ot">جمع کل: '+fmt(orderTotal(o))+' تومان</div>'+who
 +'<div class="obtns">'+btns+(o.status!=='done'?'<button class="act ghost" data-act="edit" data-id="'+o.id+'">ویرایش</button><button class="act danger" data-act="del" data-id="'+o.id+'">حذف</button>':(o.paid?'':'<button class="mini" data-pay="'+o.id+'">💵 پرداخت شد</button>'))+'</div></div>';}
function renderOrders(){const act=tableOrders().filter(o=>o.status!=='done').sort((a,b)=>b.id-a.id);
 const don=doneToday();
 let h=act.length?act.map(o=>orderCard(o)).join(''):'<div class="muted" style="padding:14px;text-align:center">سفارش فعالی نیست</div>';
 if(don.length){const byT={};don.forEach(o=>{(byT[o.table_id]=byT[o.table_id]||[]).push(o);});
  h+='<h3>تحویل‌شده‌های امروز ('+don.length+')</h3><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px">'
  +Object.keys(byT).map(t=>'<button class="act ghost" data-chip="'+t+'" style="padding:10px 4px;font-size:.75rem">'+tblLabel(+t)+'<br><b style="color:var(--accent)">'+byT[t].length+'</b></button>').join('')+'</div>';}
 $('#ordersList').innerHTML=h;
 $('#ordersList').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const id=+b.dataset.id,a=b.dataset.act;
  if(a==='prep')setStatus(id,'preparing');if(a==='done')setStatus(id,'done');if(a==='del')delOrder(id);if(a==='edit')openEdit(id);});
 $('#ordersList').querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>openTableSheet(+b.dataset.chip));
 $('#ordersList').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>markPaid(+b.dataset.pay));
 $('#ordersList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delOrder(+b.dataset.del));}
function renderReport(){const td=todayOrders();const sum=td.reduce((s,o)=>s+orderTotal(o),0);
 const paidSum=td.filter(o=>o.paid).reduce((s,o)=>s+orderTotal(o),0);
 const cnt={};td.forEach(o=>parseItems(o).forEach(it=>{cnt[it.name]=(cnt[it.name]||0)+it.qty;}));
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
 let h='<div class="chip">سفارش امروز<b>'+td.length+'</b></div><div class="chip" style="margin-top:8px">فروش امروز<b>'+fmt(sum)+' تومان</b></div>'
 +'<div class="muted" style="margin-top:6px">💵 پرداخت‌شده: '+fmt(paidSum)+' · ⏳ مانده: '+fmt(sum-paidSum)+'</div>';
 h+='<div class="muted" style="margin-top:6px">پرفروش‌ها: '+(top.length?top.map(x=>x[0]+' ('+x[1]+'×)').join(' · '):'—')+'</div>';
 const st={};td.forEach(o=>{['who','prepared_by','delivered_by'].forEach(k=>{const w=o[k];if(!w)return;if(!st[w])st[w]={reg:0,prep:0,del:0};
  if(k==='who')st[w].reg++;if(k==='prepared_by')st[w].prep++;if(k==='delivered_by')st[w].del++;});});
 h+='<h3>👥 عملکرد کارکنان</h3>'+(Object.keys(st).length?Object.entries(st).map(x=>'<div class="repRow"><span>👤 '+x[0]+'</span><span style="font-size:.78rem">ثبت '+x[1].reg+' · 🍳 '+x[1].prep+' · ✅ '+x[1].del+'</span></div>').join(''):'<div class="muted">امروز فعالیتی ثبت نشده</div>');
 $('#repSum').innerHTML=h;
 $('#repDetBtn').textContent=(repDetOpen?'بستن':'نمایش')+' جزئیات سفارش‌ها ('+td.length+')';
 $('#repDetBtn').onclick=()=>{repDetOpen=!repDetOpen;$('#repDetList').style.display=repDetOpen?'block':'none';renderReport();};
 $('#repFilters').innerHTML='';
 if(repDetOpen){const list=td.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  $('#repDetList').innerHTML=(list.length?'<div class="muted" style="margin-bottom:6px">برای ویرایش، روی هر سفارش بزن:</div>':'')+list.map(o=>'<div class="repRow click" data-oid="'+o.id+'"><span>'+hhmm(o.created_at)+' · '+tblLabel(o.table_id)+(o.who?' · '+o.who:'')+'</span><b>'+fmt(orderTotal(o))+(o.paid?' 💵':'')+'</b></div>').join('')||'<div class="muted">سفارشی امروز ثبت نشده</div>';
  $('#repDetList').querySelectorAll('[data-oid]').forEach(r=>r.onclick=()=>addMore(+r.dataset.oid));}
 const arcs=orders.filter(o=>o.archived);const days={};arcs.forEach(o=>{const d=(o.archived_at||o.created_at||'').slice(0,10);(days[d]=days[d]||[]).push(o);});
 const dkeys=Object.keys(days).sort().reverse();
 $('#repArc').innerHTML=dkeys.length?dkeys.map(d=>{const L=days[d];const s2=L.reduce((x,o)=>x+orderTotal(o),0);const open=arcOpenDay===d;
  return '<div class="row" style="flex-direction:column;align-items:stretch"><div style="display:flex;justify-content:space-between;cursor:pointer" data-day="'+d+'"><span>روز '+faDate(d)+' — '+L.length+' سفارش</span><b style="color:var(--accent)">'+fmt(s2)+'</b></div>'
  +(open?'<div style="margin-top:8px">'+L.map(o=>'<div class="repRow"><span>'+hhmm(o.created_at)+' · '+tblLabel(o.table_id)+(o.who?' · '+o.who:'')+'</span><b>'+fmt(orderTotal(o))+'</b></div>').join('')+'</div>':'')+'</div>';}).join(''):'<div class="muted">آرشیوی نیست</div>';
 $('#repArc').querySelectorAll('[data-day]').forEach(r=>r.onclick=()=>{arcOpenDay=arcOpenDay===r.dataset.day?null:r.dataset.day;renderReport();});}
/* ===== پیام‌ها ===== */
let chatWith=null,msgs=[],msgSeen={};
try{msgSeen=JSON.parse(localStorage.getItem('cafeMsgSeen')||'{}');}catch(e){}
async function fetchMsgs(){try{const{data}=await sb.from('cafe_messages').select('*').order('id',{ascending:false}).limit(200);msgs=(data||[]).reverse();
 const key=role==='admin'?'admin':userName;
 const unread=msgs.filter(m=>m.rcpt===key&&new Date(m.created_at)>new Date(msgSeen[key]||0));
 if(unread.length&&inited){playSound('new');vib([200,100,200]);showToast('💬 پیام جدید');}
 if($('#s-chat').classList.contains('show'))renderChat();}catch(e){}}
function renderChat(){const box=$('#chatArea');
 if(role==='admin'&&!chatWith){
  const groups={};msgs.forEach(m=>{const other=m.role==='admin'?m.rcpt:m.sender;if(!other)return;groups[other]=groups[other]||[];groups[other].push(m);});
  box.innerHTML='<div class="muted" style="margin-bottom:8px">گفتگو با کارکنان:</div>'
  +(Object.keys(groups).length?Object.keys(groups).map(n=>{const unread=groups[n].filter(m=>m.rcpt==='admin'&&new Date(m.created_at)>new Date(msgSeen.admin||0)).length;
   return '<div class="row" style="cursor:pointer" data-cw="'+n+'"><span>👤 '+n+'</span>'+(unread?'<span class="badge">'+unread+' جدید</span>':'<span class="muted">'+groups[n].length+' پیام</span>')+'</div>';}).join(''):'<div class="muted">پیامی نیست</div>')
  +'<button class="act ghost" id="msgPurge" style="width:100%;margin-top:12px">🧹 پاک‌سازی پیام‌های قدیمی</button>';
  box.querySelectorAll('[data-cw]').forEach(b=>b.onclick=()=>{chatWith=b.dataset.cw;msgSeen.admin=new Date().toISOString();localStorage.setItem('cafeMsgSeen',JSON.stringify(msgSeen));renderChat();});
  const pg=$('#msgPurge');if(pg)pg.onclick=async()=>{const d=prompt('پاک‌سازی پیام‌های قدیمی‌تر از چند روز؟ (عدد — یا all برای همه)');if(!d)return;
   if(d==='all'){if(confirm('همه پیام‌ها حذف شوند؟'))await sb.from('cafe_messages').delete().neq('id',0);}
   else{const n=parseInt(d);if(n>0)await sb.from('cafe_messages').delete().lt('created_at',new Date(Date.now()-n*864e5).toISOString());}
   fetchMsgs();showToast('پاک‌سازی شد');};
  return;}
 const other=role==='admin'?chatWith:'مدیر';
 const conv=msgs.filter(m=>(m.sender===other&&(!m.rcpt||m.rcpt===userName))||(m.sender===userName&&m.rcpt===other));
 const key=role==='admin'?'admin':userName;
 msgSeen[key]=new Date().toISOString();localStorage.setItem('cafeMsgSeen',JSON.stringify(msgSeen));
 box.innerHTML=(role==='admin'?'<button class="mini" id="chatBack">🡐 برگشت</button> ':'')+'<b>گفتگو با '+other+'</b>'
 +'<div style="margin:10px 0;max-height:46vh;overflow-y:auto">'+(conv.length?conv.map(m=>'<div style="text-align:'+(m.sender===userName?'left':'right')+';margin-bottom:6px"><span style="display:inline-block;max-width:80%;padding:8px 12px;border-radius:14px;font-size:.85rem;background:'+(m.sender===userName?'var(--accent)':'var(--card)')+';color:'+(m.sender===userName?'var(--accentText)':'var(--text)')+'">'+(m.tag?'🛒 ':'')+(m.tag==='rem'?'📌 ':'')+m.body+'<div style="font-size:.65rem;opacity:.7">'+hhmm(m.created_at)+'</div></span></div>').join(''):'<div class="muted">پیامی نیست</div>')+'</div>'
 +'<div class="frm"><input id="chatInp" placeholder="پیام..."><button class="act" id="chatSend">ارسال</button></div>'
 +(role==='staff'?'<label class="muted" style="display:flex;gap:6px;align-items:center;font-size:.78rem"><input type="checkbox" id="chatShop" style="width:auto"> این یه لیست خریده 🛒</label>':'');
 const bk=$('#chatBack');if(bk)bk.onclick=()=>{chatWith=null;renderChat();};
 $('#chatSend').onclick=async()=>{const v=$('#chatInp').value.trim();if(!v)return;
  await sb.from('cafe_messages').insert({sender:userName,rcpt:other,role:role,body:v,tag:$('#chatShop')&&$('#chatShop').checked?'shop':''});
  $('#chatInp').value='';fetchMsgs();};
 $('#chatInp').onkeydown=e=>{if(e.key==='Enter')$('#chatSend').click();};}
function buildNav(){const tabs=[['tables','میزها'],['menu','منو'],['orders','سفارش‌ها']];if(role==='admin'){tabs.push(['admin','مدیریت'],['report','گزارش']);}
 tabs.push(['chat','💬 پیام']);
 $('#nav').innerHTML=tabs.map(t=>'<button data-t="'+t[0]+'" class="'+($('#nav').dataset.cur===t[0]?'active':'')+'">'+t[1]+'</button>').join('');
 $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
 $('#dash').style.display=role?'grid':'none';}
const _showTab=showTab;
function showTab(id){_showTab(id);if(id==='chat')renderChat();}
</script>
<script>
/* ===== پچ اصلاح تب پیام ===== */
(function(){if(!$('#s-chat')){const s=document.createElement('section');s.id='s-chat';s.innerHTML='<div id="chatArea"></div>';document.querySelector('main').appendChild(s);}})();
function showTab(id){$('#nav').dataset.cur=id;document.querySelectorAll('main section').forEach(s=>s.classList.remove('show'));const sec=$('#s-'+id);if(sec)sec.classList.add('show');$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.t===id));if(id==='tables'){renderDash();renderTables();}if(id==='orders')renderOrders();if(id==='menu'){renderCats();renderMenuList();}if(id==='admin'&&role==='admin')renderAdmin();if(id==='report'&&role==='admin')renderReport();if(id==='chat')renderChat();}
fetchMsgs();setInterval(fetchMsgs,4000);

<script>
/* ===== پچ شروع چت توسط مدیر ===== */
let pickOpen=false;
function renderChat(){const box=$('#chatArea');
 if(role==='admin'&&!chatWith){
  const groups={};msgs.forEach(m=>{const other=m.role==='admin'?m.rcpt:m.sender;if(!other)return;groups[other]=groups[other]||[];groups[other].push(m);});
  let h='<div class="muted" style="margin-bottom:8px">گفتگو با کارکنان:</div>'
  +(Object.keys(groups).length?Object.keys(groups).map(n=>{const unread=groups[n].filter(m=>m.rcpt==='admin'&&new Date(m.created_at)>new Date(msgSeen.admin||0)).length;
   return '<div class="row" style="cursor:pointer" data-cw="'+n+'"><span>👤 '+n+'</span>'+(unread?'<span class="badge">'+unread+' جدید</span>':'<span class="muted">'+groups[n].length+' پیام</span>')+'</div>';}).join(''):'<div class="muted">هنوز گفتگوئی نیست</div>')
  +'<button class="act" id="newChatBtn" style="width:100%;margin-top:12px">➕ پیام به کارمند</button>'
  +'<button class="act ghost" id="msgPurge" style="width:100%;margin-top:8px">🧹 پاک‌سازی پیام‌های قدیمی</button>';
  if(pickOpen){
   h+='<div class="muted" style="margin-top:12px">با کدوم کارمند؟</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">'
   +(staffList.length?staffList.map(s=>'<button class="act ghost" data-pick="'+s.name+'">'+s.name+'</button>').join(''):'<div class="muted">اول از تب مدیریت کارمند بساز</div>')+'</div>';}
  box.innerHTML=h;
  $('#newChatBtn').onclick=()=>{pickOpen=!pickOpen;renderChat();};
  box.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{chatWith=b.dataset.pick;pickOpen=false;msgSeen.admin=new Date().toISOString();localStorage.setItem('cafeMsgSeen',JSON.stringify(msgSeen));renderChat();});
  box.querySelectorAll('[data-cw]').forEach(b=>b.onclick=()=>{chatWith=b.dataset.cw;msgSeen.admin=new Date().toISOString();localStorage.setItem('cafeMsgSeen',JSON.stringify(msgSeen));renderChat();});
  const pg=$('#msgPurge');if(pg)pg.onclick=async()=>{const d=prompt('پاک‌سازی پیام‌های قدیمی‌تر از چند روز؟ (عدد — یا all برای همه)');if(!d)return;
   if(d==='all'){if(confirm('همه پیام‌ها حذف شوند؟'))await sb.from('cafe_messages').delete().neq('id',0);}
   else{const n=parseInt(d);if(n>0)await sb.from('cafe_messages').delete().lt('created_at',new Date(Date.now()-n*864e5).toISOString());}
   fetchMsgs();showToast('پاک‌سازی شد');};
  return;}
 const other=role==='admin'?chatWith:'مدیر';
 const conv=msgs.filter(m=>(m.sender===other&&(!m.rcpt||m.rcpt===userName))||(m.sender===userName&&m.rcpt===other));
 const key=role==='admin'?'admin':userName;
 msgSeen[key]=new Date().toISOString();localStorage.setItem('cafeMsgSeen',JSON.stringify(msgSeen));
 box.innerHTML=(role==='admin'?'<button class="mini" id="chatBack">🡐 برگشت</button> ':'')+'<b>گفتگو با '+other+'</b>'
 +'<div style="margin:10px 0;max-height:46vh;overflow-y:auto">'+(conv.length?conv.map(m=>'<div style="text-align:'+(m.sender===userName?'left':'right')+';margin-bottom:6px"><span style="display:inline-block;max-width:80%;padding:8px 12px;border-radius:14px;font-size:.85rem;background:'+(m.sender===userName?'var(--accent)':'var(--card)')+';color:'+(m.sender===userName?'var(--accentText)':'var(--text)')+'">'+(m.tag==='shop'?'🛒 ':'')+(m.tag==='rem'?'📌 ':'')+m.body+'<div style="font-size:.65rem;opacity:.7">'+hhmm(m.created_at)+'</div></span></div>').join(''):'<div class="muted">اولین پیام رو بفرست!</div>')+'</div>'
 +'<div class="frm"><input id="chatInp" placeholder="پیام..."><button class="act" id="chatSend">ارسال</button></div>'
 +(role==='staff'?'<label class="muted" style="display:flex;gap:6px;align-items:center;font-size:.78rem"><input type="checkbox" id="chatShop" style="width:auto"> این یه لیست خریده 🛒</label>':'');
 const bk=$('#chatBack');if(bk)bk.onclick=()=>{chatWith=null;renderChat();};
 $('#chatSend').onclick=async()=>{const v=$('#chatInp').value.trim();if(!v)return;
  const{error}=await sb.from('cafe_messages').insert({sender:userName,rcpt:other,role:role,body:v,tag:($('#chatShop')&&$('#chatShop').checked)?'shop':''});
  if(error){showToast('خطا در ارسال: '+error.message);return;}
  $('#chatInp').value='';fetchMsgs();};
 $('#chatInp').onkeydown=e=>{if(e.key==='Enter')$('#chatSend').click();};}
</script>
<script>
/* ===== پچ جمعی نهایی: انتقال میز + پرداخت آیتمی + تسویه + کیبورد پیام + داشبورد کارمند + پایان روز ===== */
function parseItems(o){try{return (JSON.parse(o.items||'[]')).map(function(it){return {name:it.name||it.n||'',price:Number(it.price!=null?it.price:(it.p!=null?it.p:0)),qty:Number(it.qty||it.q||1),note:it.note||it.t||'',pd:!!(it.pd||it.paid)};});}catch(e){return[];}}
function itemPaid(o){return parseItems(o).filter(function(i){return i.pd;}).reduce(function(s,i){return s+i.qty*(i.price||0);},0);}
function itemRem(o){return orderTotal(o)-itemPaid(o);}
function markPaid(id){const o=orders.find(x=>x.id===id);if(!o)return;const its=parseItems(o).map(i=>Object.assign({},i,{pd:true}));
 sb.from('cafe_orders').update({items:JSON.stringify(its),paid:true}).eq('id',id).then(()=>{showToast('💵 پرداخت ثبت شد');fetchOrders();});}
function markItemPaid(id,idx){const o=orders.find(x=>x.id===id);if(!o)return;const its=parseItems(o);if(!its[idx])return;its[idx].pd=true;
 const all=its.every(i=>i.pd);const up={items:JSON.stringify(its)};if(all)up.paid=true;
 sb.from('cafe_orders').update(up).eq('id',id).then(()=>{showToast('💵 پرداخت شد');fetchOrders();});}
function settleTable(t){const list=orders.filter(o=>!o.archived&&o.table_id===t);const jobs=[];
 list.forEach(o=>{if(itemRem(o)>0){const its=parseItems(o).map(i=>Object.assign({},i,{pd:true}));jobs.push(sb.from('cafe_orders').update({items:JSON.stringify(its),paid:true}).eq('id',o.id));}});
 Promise.all(jobs).then(()=>{showToast('💵 کل '+tblLabel(t)+' تسویه شد');fetchOrders();openTableSheet(t);});}
function moveTable(fromT){const list=orders.filter(o=>!o.archived&&o.table_id===fromT);if(!list.length){showToast('سفارشی برای انتقال نیست');return;}
 const busy=new Set(tableOrders().map(o=>o.table_id));
 let h='<b>🔄 انتقال — به کدام میز؟</b><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px">';
 for(let i=1;i<=TABLE_COUNT;i++){if(i===fromT||busy.has(i))continue;h+='<button class="act ghost" data-mv="'+i+'">میز '+i+'</button>';}
 h+='</div><button class="act ghost" id="mvCancel" style="width:100%;margin-top:10px">انصراف</button>';
 $('#tableSheet').innerHTML=h;
 $('#tableSheet').querySelectorAll('[data-mv]').forEach(b=>b.onclick=async()=>{const to=+b.dataset.mv;
  await sb.from('cafe_orders').update({table_id:to}).in('id',list.map(o=>o.id));
  $('#tableOv').classList.remove('show');showToast('همه سفارش‌ها به میز '+to+' منتقل شد');fetchOrders();});
 $('#mvCancel').onclick=()=>openTableSheet(fromT);
 $('#tableOv').classList.add('show');}
function renderDash(){const act=activeOrders();const occ=new Set(tableOrders().map(o=>o.table_id)).size;
 let h='<div class="chip">میز آزاد<b>'+(TABLE_COUNT-occ)+'</b></div><div class="chip">میز اشغال<b>'+occ+'</b></div><div class="chip">سفارش فعال<b>'+act.length+'</b></div>';
 if(role==='admin')h+='<div class="chip">فروش امروز<b>'+fmt(todayOrders().reduce((s,o)=>s+orderTotal(o),0))+'</b></div>';
 $('#dash').innerHTML=h;}
function openTableSheet(t){const list=orders.filter(o=>!o.archived&&o.table_id===t).sort((a,b)=>b.id-a.id);
 const stLbl=s=>s==='new'?'جدید':(s==='preparing'?'در حال آماده‌سازی':'تحویل شد ✓');
 const tot=list.reduce((s,o)=>s+orderTotal(o),0),paidSum=list.reduce((s,o)=>s+itemPaid(o),0),rem=tot-paidSum;
 const takeout=t===TAKEOUT;
 const rows=list.map(o=>'<div class="row" style="flex-direction:column;align-items:stretch">'
  +'<div style="display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)"><span>#'+o.id+' · '+hhmm(o.created_at)+' · '+stLbl(o.status)+'</span><span>مانده: <b style="color:'+(itemRem(o)>0?'var(--bad)':'var(--good)')+'">'+fmt(itemRem(o))+'</b></span></div>'
  +parseItems(o).map((it,idx)=>'<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:.84rem"><span>'+it.name+' ×'+it.qty+(it.note?' <span class="muted">('+it.note+')</span>':'')+'</span><span style="display:flex;gap:6px;align-items:center"><b style="white-space:nowrap">'+(it.price?fmt(it.price*it.qty):'—')+'</b>'+(it.pd?'<span style="color:var(--good)">✅</span>':'<button class="mini" data-ip="'+o.id+'|'+idx+'">💵</button>')+'</span></div>').join('')
  +'</div>').join('');
 $('#tableSheet').innerHTML='<b>'+tblLabel(t)+'</b>'
 +(list.length?'<div class="muted" style="margin:8px 0">💵 پرداخت‌شده: '+fmt(paidSum)+' · ⏳ مانده: '+fmt(rem)+'</div>':'')
 +'<div style="margin:8px 0">'+(rows||'<span class="muted">سفارشی ندارد</span>')+'</div>'
 +(rem>0?'<button class="act" id="tsSettle" style="width:100%">💵 تسویه کل — همه پرداخت شد</button>':'')
 +'<div style="display:grid;gap:8px;margin-top:8px"><button class="act" id="tsAdd">سفارش جدید</button>'
 +(orders.some(o=>o.table_id===t)?'<button class="act ghost" id="tsRep">تکرار سفارش قبلی</button>':'')
 +(!takeout&&list.length?'<button class="act ghost" id="tsMove">🔄 انتقال میز</button>':'')
 +(list.length?'<button class="act danger" id="tsFree">'+(takeout?'🧹 بستن (تحویل داده شد)':'مشتری رفت — بستن حساب')+'</button>':'')+'</div>';
 $('#tsSettle')&&($('#tsSettle').onclick=()=>settleTable(t));
 $('#tsAdd').onclick=()=>{$('#tableOv').classList.remove('show');startOrder(t);};
 const r=$('#tsRep');if(r)r.onclick=()=>{const last=orders.filter(o=>o.table_id===t).sort((a,b)=>b.id-a.id)[0];cart=parseItems(last);currentTable=t;$('#tableOv').classList.remove('show');showTab('menu');openCart();};
 const mv=$('#tsMove');if(mv)mv.onclick=()=>moveTable(t);
 const f=$('#tsFree');if(f)f.onclick=()=>{const remList=list.filter(o=>itemRem(o)>0);
  if(!remList.length){doCloseTable(t,list);return;}
  $('#tableSheet').innerHTML='<b>🧹 بستن حساب — '+tblLabel(t)+'</b><div class="muted" style="margin:8px 0">این‌ها هنوز پرداخت نشده:</div>'
  +remList.map(o=>'<div class="row" style="flex-direction:column;align-items:stretch"><div style="display:flex;justify-content:space-between;font-size:.8rem"><span>#'+o.id+'</span><b>'+fmt(itemRem(o))+'</b></div>'+parseItems(o).map((it,idx)=>it.pd?'':'<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:.82rem"><span>'+it.name+' ×'+it.qty+'</span><button class="mini" data-ip="'+o.id+'|'+idx+'">💵 پرداخت شد</button></div>').join('')+'</div>').join('')
  +'<div style="display:grid;gap:8px;margin-top:10px"><button class="act" id="ckRefresh">بروزرسانی</button><button class="act danger" id="ckForce">بستن بدون تسویه</button></div>';
  $('#tableSheet').querySelectorAll('[data-ip]').forEach(b=>b.onclick=()=>{const p=b.dataset.ip.split('|');markItemPaid(+p[0],+p[1]);setTimeout(()=>openTableSheet(t),600);});
  $('#ckRefresh').onclick=()=>openTableSheet(t);
  $('#ckForce').onclick=()=>{if(confirm('مطمئنی؟ حساب پرداخت‌نشده می‌مونه!'))doCloseTable(t,orders.filter(o=>!o.archived&&o.table_id===t));};};
 $('#tableSheet').querySelectorAll('[data-ip]').forEach(b=>b.onclick=()=>{const p=b.dataset.ip.split('|');markItemPaid(+p[0],+p[1]);});
 $('#tableOv').classList.add('show');}
function orderCard(o){const its=parseItems(o);const mins=Math.floor((Date.now()-new Date(o.created_at))/60000);
 const late=o.status!=='done'&&mins>=5;
 const btns=o.status==='new'?'<button class="act" data-act="prep" data-id="'+o.id+'">شروع آماده‌سازی</button>':o.status==='preparing'?'<button class="act" data-act="done" data-id="'+o.id+'">تحویل شد</button>':'';
 const who='<div class="muted" style="font-size:.72rem;margin-top:4px">📝 '+(o.who||'—')+(o.prepared_by?' · 🍳 '+o.prepared_by:'')+(o.delivered_by?' · ✅ '+o.delivered_by:'')+'</div>';
 return '<div class="oc"><div class="oh"><b>سفارش #'+o.id+' · '+tblLabel(o.table_id)+'</b><span>'+hhmm(o.created_at)+'</span></div>'
 +(late?'<div class="warn" style="font-size:.75rem;margin-top:4px">معطل '+mins+' دقیقه!</div>':'')
 +'<div class="ol" style="display:block">'+its.map((it,idx)=>'<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:.85rem"><span>'+it.name+' ×'+it.qty+(it.note?' <span class="muted">('+it.note+')</span>':'')+'</span><span style="display:flex;gap:6px;align-items:center"><b style="white-space:nowrap">'+(it.price?fmt(it.price*it.qty):'—')+'</b>'+(it.pd?'<span style="color:var(--good)">✅</span>':(o.status==='done'?'<button class="mini" data-ip="'+o.id+'|'+idx+'">💵</button>':'<span class="muted" style="font-size:.7rem">🔶</span>'))+'</span></div>').join('')+'</div>'
 +'<div class="ot">مانده: '+fmt(itemRem(o))+' تومان'+(itemPaid(o)?' · 💵: '+fmt(itemPaid(o)):'')+'</div>'+who
 +'<div class="obtns">'+btns+(o.status!=='done'?'<button class="act ghost" data-act="edit" data-id="'+o.id+'">ویرایش</button><button class="act danger" data-act="del" data-id="'+o.id+'">حذف</button>':(itemRem(o)>0?'<button class="mini" data-pay="'+o.id+'">💵 پرداخت کل</button>':''))+'</div></div>';}
function renderOrders(){const act=tableOrders().filter(o=>o.status!=='done').sort((a,b)=>b.id-a.id);
 const don=doneToday();
 let h=act.length?act.map(o=>orderCard(o)).join(''):'<div class="muted" style="padding:14px;text-align:center">سفارش فعالی نیست</div>';
 if(don.length){const byT={};don.forEach(o=>{(byT[o.table_id]=byT[o.table_id]||[]).push(o);});
  h+='<h3>تحویل‌شده‌های امروز ('+don.length+')</h3><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px">'
  +Object.keys(byT).map(t=>'<button class="act ghost" data-chip="'+t+'" style="padding:10px 4px;font-size:.75rem">'+tblLabel(+t)+'<br><b style="color:var(--accent)">'+byT[t].length+'</b></button>').join('')+'</div>';}
 $('#ordersList').innerHTML=h;
 $('#ordersList').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const id=+b.dataset.id,a=b.dataset.act;
  if(a==='prep')setStatus(id,'preparing');if(a==='done')setStatus(id,'done');if(a==='del')delOrder(id);if(a==='edit')openEdit(id);});
 $('#ordersList').querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>openTableSheet(+b.dataset.chip));
 $('#ordersList').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>markPaid(+b.dataset.pay));
 $('#ordersList').querySelectorAll('[data-ip]').forEach(b=>b.onclick=()=>{const p=b.dataset.ip.split('|');markItemPaid(+p[0],+p[1]);});
 $('#ordersList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delOrder(+b.dataset.del));}
function renderReport(){const td=todayOrders();const sum=td.reduce((s,o)=>s+orderTotal(o),0);
 const paidSum=td.reduce((s,o)=>s+itemPaid(o),0);
 const cnt={};td.forEach(o=>parseItems(o).forEach(it=>{cnt[it.name]=(cnt[it.name]||0)+it.qty;}));
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
 let h='<div class="chip">سفارش امروز<b>'+td.length+'</b></div><div class="chip" style="margin-top:8px">فروش امروز<b>'+fmt(sum)+' تومان</b></div>'
 +'<div class="muted" style="margin-top:6px">💵 پرداخت‌شده: '+fmt(paidSum)+' · ⏳ مانده: '+fmt(sum-paidSum)+'</div>';
 h+='<div class="muted" style="margin-top:6px">پرفروش‌ها: '+(top.length?top.map(x=>x[0]+' ('+x[1]+'×)').join(' · '):'—')+'</div>';
 const st={};td.forEach(o=>{['who','prepared_by','delivered_by'].forEach(k=>{const w=o[k];if(!w)return;if(!st[w])st[w]={reg:0,prep:0,del:0};
  if(k==='who')st[w].reg++;if(k==='prepared_by')st[w].prep++;if(k==='delivered_by')st[w].del++;});});
 h+='<h3>👥 عملکرد کارکنان</h3>'+(Object.keys(st).length?Object.entries(st).map(x=>'<div class="repRow"><span>👤 '+x[0]+'</span><span style="font-size:.78rem">ثبت '+x[1].reg+' · 🍳 '+x[1].prep+' · ✅ '+x[1].del+'</span></div>').join(''):'<div class="muted">امروز فعالیتی ثبت نشده</div>');
 $('#repSum').innerHTML=h;
 $('#repDetBtn').textContent=(repDetOpen?'بستن':'نمایش')+' جزئیات سفارش‌ها ('+td.length+')';
 $('#repDetBtn').onclick=()=>{repDetOpen=!repDetOpen;$('#repDetList').style.display=repDetOpen?'block':'none';renderReport();};

<script>
/* ===== پچ v4.0: دسته‌ها توی پنجره + آیتم دو ستونه ===== */
document.title='کافه روبیک v4.0';
setTimeout(()=>showToast('✅ نسخه ۴.۰ فعال شد'),800);
(function(){
 const q=s=>document.querySelector(s);
 const listEl=q('#menuList')||q('#menu-list')||q('#menuItems');
 if(listEl){listEl.style.display='grid';listEl.style.gridTemplateColumns='1fr 1fr';listEl.style.gap='8px';}
 const catsEl=q('#cats')||q('#catsRow')||q('#catGrid');
 const sec=q('#s-menu');
 if(!catsEl||!sec)return;
 let ov=document.getElementById('catOv');
 if(!ov){ov=document.createElement('div');ov.id='catOv';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none;align-items:flex-end';
  ov.innerHTML='<div style="background:var(--card,#232323);border-radius:18px 18px 0 0;padding:14px;width:100%;max-height:70vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b>دسته‌ها</b><button class="mini" id="catX">✕</button></div><div id="catHolder"></div></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)closeCats();});
  q('#catX').onclick=closeCats;}
 function closeCats(){ov.style.display='none';}
 catsEl.parentNode.removeChild(catsEl);
 q('#catHolder').appendChild(catsEl);
 let btn=document.getElementById('catBtn');
 if(!btn){btn=document.createElement('button');btn.id='catBtn';btn.className='act';btn.style.cssText='width:100%;margin-bottom:10px';sec.insertBefore(btn,sec.firstChild);}
 btn.innerHTML='◎ انتخاب دسته: '+(localStorage.getItem('lastCat')||'—');
 btn.onclick=()=>{ov.style.display='flex';};
 catsEl.addEventListener('click',e=>{const t=(e.target.textContent||'').trim().split('\n')[0].slice(0,24);
  if(t&&!/✕/.test(t)){localStorage.setItem('lastCat',t);btn.innerHTML='◎ '+t;}
  setTimeout(closeCats,150);},true);
 if(window.renderCats){const _rc=window.renderCats;
  window.renderCats=function(){const r=_rc.apply(this,arguments);
   const last=localStorage.getItem('lastCat');
   if(last){const el=[...catsEl.querySelectorAll('*')].find(n=>!n.children.length&&n.textContent.trim()===last);
    if(el)setTimeout(()=>el.click(),0);}return r;};}
})();
</script>
<script>
/* ===== پچ v4.1: دایره‌های دسته کوچیک — ۴ تایی در ردیف ===== */
document.title='کافه روبیک v4.1';
setTimeout(()=>showToast('✅ نسخه ۴.۱ فعال شد'),800);
(function(){
 const sec=document.querySelector('#s-menu');if(!sec)return;
 function shrink(){
  const cand=[...sec.querySelectorAll('div,button,span')].filter(n=>{
   const s=getComputedStyle(n);const r=parseFloat(s.borderRadius);
   return r>0&&n.offsetWidth>0&&Math.min(n.offsetWidth,n.offsetHeight)>=100&&r/Math.min(n.offsetWidth,n.offsetHeight)>=0.4&&n.textContent.trim().length>0&&n.textContent.trim().length<25&&n.children.length<=1;});
  cand.forEach(n=>{n.style.width='80px';n.style.height='80px';n.style.minWidth='80px';n.style.fontSize='.7rem';n.style.padding='4px';});
  const p=cand[0]&&cand[0].parentElement;
  if(p){p.style.display='grid';p.style.gridTemplateColumns='repeat(4,1fr)';p.style.gap='8px';p.style.justifyItems='center';}}
 shrink();
 if(window.renderCats){const _rc=window.renderCats;window.renderCats=function(){const r=_rc.apply(this,arguments);setTimeout(shrink,0);return r;};}
 if(window.showTab){const _st=window.showTab;window.showTab=function(){const r=_st.apply(this,arguments);setTimeout(shrink,0);return r;};}
})();
</script>
<script>

(function(){
 function shrink(){

   const s=getComputedStyle(n);if(s.display==='none')return false;
   const w=n.offsetWidth,h=n.offsetHeight;
   if(!w||w<90||Math.abs(w-h)>14)return false;
   const r=parseFloat(s.borderRadius);
   if(!(r/Math.min(w,h)>=0.4))return false;
   const t=(n.textContent||'').trim();
   return t.length>0&&t.length<25&&n.children.length<=1;});
  circ.forEach(n=>{n.style.width='76px';n.style.height='76px';n.style.minWidth='76px';n.style.fontSize='.68rem';n.style.padding='2px';});
  const p=circ[0]&&circ[0].parentElement;
  if(p&&p.children.length>=4&&p.id!=='nav'){
   p.style.display='grid';p.style.gridTemplateColumns='repeat(4,1fr)';p.style.gap='10px';p.style.justifyItems='center';p.style.alignItems='center';}}
 shrink();setInterval(shrink,1500);
})();
