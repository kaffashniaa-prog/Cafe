<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<title>سفارش‌گیری کافه روبیک</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<link rel="manifest" href='data:application/manifest+json,{"name":"Cafe Rubik","short_name":"Cafe","start_url":".","display":"standalone","background_color":"%230b0b0b","theme_color":"%230b0b0b"}'>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--text);padding-bottom:120px;transition:background .3s,color .3s}
.theme-dark{--bg:#0b0b0b;--panel:#161616;--card:#1f1f1f;--text:#f2ede6;--muted:#a39a90;--accent:#f5872e;--accentText:#1a120c;--line:#2d2d2d;--good:#4caf7d;--bad:#e0705c;--soft:rgba(245,135,46,.14)}
.theme-light{--bg:#f7f3ee;--panel:#efe6dc;--card:#ffffff;--text:#2b211b;--muted:#7c6f64;--accent:#c96d32;--accentText:#ffffff;--line:#e7ddd2;--good:#2e8f5e;--bad:#c4523c;--soft:rgba(201,109,50,.10)}
.theme-orange{--bg:#fff3e8;--panel:#ffe5d2;--card:#ffffff;--text:#3a2016;--muted:#80685a;--accent:#d85b24;--accentText:#ffffff;--line:#efc8b0;--good:#1d6e44;--bad:#a33418;--soft:rgba(216,91,36,.10)}
.theme-blue{--bg:#f2f6fa;--panel:#e6eef6;--card:#ffffff;--text:#172a3a;--muted:#65798b;--accent:#2f6f9f;--accentText:#ffffff;--line:#d2dee9;--good:#2e8f5e;--bad:#c4523c;--soft:rgba(47,111,159,.10)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--panel)}
header h1{font-size:1.05rem}
.hbtns{display:flex;gap:6px}
.hbtns button{border:none;background:var(--card);color:var(--text);border-radius:10px;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hbtns button.off{opacity:.45}
.hbtns svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#banner{display:none;position:fixed;top:10px;right:50%;transform:translateX(50%);z-index:90;background:var(--accent);color:var(--accentText);padding:10px 18px;border-radius:12px;font-weight:bold;font-size:.85rem;box-shadow:0 4px 18px rgba(0,0,0,.35);max-width:92vw;text-align:center}
#dash{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.75rem;color:var(--muted)}
.chip b{display:block;font-size:1.25rem;color:var(--accent);margin-top:2px}
nav{display:flex;gap:6px;padding:10px 12px;background:var(--panel);position:sticky;top:0;z-index:15;border-bottom:1px solid var(--line)}
nav button{flex:1;padding:11px 2px;border:none;border-radius:12px;background:var(--card);color:var(--text);font-family:inherit;font-size:.83rem;cursor:pointer}
nav button.active{background:var(--accent);color:var(--accentText);font-weight:bold}
main{padding:14px}
main section{display:none}
main section.show{display:block;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
button{font-family:inherit}
.act{border:none;border-radius:10px;padding:9px 14px;background:var(--accent);color:var(--accentText);font-weight:bold;cursor:pointer;font-size:.85rem}
.act.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.act.danger{background:var(--bad);color:#fff}
.act:active{transform:scale(.96)}
input,select{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-family:inherit;font-size:.9rem;width:100%}
.muted{color:var(--muted);font-size:.85rem}
h3{font-size:.95rem;margin:18px 0 8px;color:var(--accent)}
#tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.tcard{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px 8px 12px;text-align:center;cursor:pointer;overflow:hidden;transition:transform .1s}
.tcard:active{transform:scale(.95)}
.tcard::before{content:'';position:absolute;top:0;right:0;left:0;height:5px;background:var(--good);opacity:.7}
.tcard .tn{font-size:1.05rem;font-weight:bold;margin-top:6px}
.tcard .ts{font-size:.72rem;color:var(--muted);margin-top:4px}
.tcard.occ{background:var(--soft);border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tcard.occ::before{background:var(--accent);opacity:1}
.tcard.occ .ts{color:var(--accent);font-weight:bold}
#searchWrap{display:none;gap:6px;margin-bottom:10px}
#searchWrap.open{display:flex}
#catCircles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.circ{width:82px;height:82px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;text-align:center;font-size:.72rem;padding:6px;cursor:pointer;line-height:1.3}
.circ.active{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:bold;box-shadow:0 3px 12px var(--soft)}
.mitem{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.mitem .nm{font-weight:bold;font-size:.92rem}
.mitem .pr{color:var(--accent);font-size:.85rem;margin-top:3px}
.mitem.sold{opacity:.5}
.qtybox{display:flex;align-items:center;gap:8px}
.qtybox button{width:32px;height:32px;border-radius:50%;border:none;background:var(--accent);color:var(--accentText);font-size:1.1rem;font-weight:bold;cursor:pointer}
.qtybox .qn{min-width:20px;text-align:center;font-weight:bold;color:var(--accent)}
.badge{display:inline-block;background:var(--bad);color:#fff;border-radius:8px;padding:2px 8px;font-size:.7rem}
.oc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.oc .oh{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted)}
.oc .oh b{color:var(--text);font-size:.9rem}
.oc .ol{margin:8px 0;font-size:.85rem;line-height:1.9}
.oc .ot{font-weight:bold;color:var(--accent);border-top:1px dashed var(--line);padding-top:8px;font-size:.9rem}
.oc .warn{color:var(--bad);font-weight:bold}
.obtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.obtns button{flex:1;min-width:80px}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;gap:8px;font-size:.88rem}
.row .btns{display:flex;gap:4px}
.mini{border:none;border-radius:8px;padding:6px 10px;background:var(--soft);color:var(--accent);font-weight:bold;cursor:pointer;font-size:.75rem}
.mini.rd{color:var(--bad)}
.frm{display:flex;gap:6px;margin:8px 0}
#cartBar{display:none;position:fixed;bottom:12px;right:12px;left:12px;z-index:40;background:var(--accent);color:var(--accentText);border-radius:16px;padding:14px;font-weight:bold;font-size:.95rem;text-align:center;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#cartBar:active{transform:scale(.98)}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.ov.center{align-items:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px;animation:up .22s}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.loginBox{background:var(--bg);border-radius:20px;padding:24px;width:88%;max-width:360px;text-align:center}
.loginBox input{text-align:center;font-size:1.4rem;letter-spacing:8px;margin:14px 0}
.repRow{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:.82rem}
.repRow.click{cursor:pointer}
.filterTag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);border-radius:10px;padding:4px 10px;font-size:.75rem;font-weight:bold;margin:2px;cursor:pointer}
</style>
</head>
<body class="theme-dark">
<header>
  <h1>کافه روبیک</h1>
  <div class="hbtns">
    <button id="soundTgl" title="صدا"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button id="themeTgl" title="تم"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18c1.5 0 2-.8 2-1.6 0-1.4-1.3-1.6-1.3-2.9 0-1 .8-1.5 2-1.5h1.6c1.9 0 3.7-1.6 3.7-4.1A8 8 0 0 0 12 3z"/></svg></button>
    <button id="exitBtn" title="خروج"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
  </div>
</header>
<div id="banner"></div>
<div id="dash"></div>
<nav id="nav"></nav>
<main>
  <section id="s-tables"><div id="chips"></div><div id="tgrid"></div></section>
  <section id="s-menu">
    <div id="searchWrap"><input id="searchInp" placeholder="جستجو در کل منو..."><button class="act ghost" id="searchClose">بستن</button></div>
    <div style="display:flex;justify-content:flex-start;margin-bottom:8px"><button class="mini" id="searchTgl">جستجو</button></div>
    <div id="catCircles"></div>
    <div id="menuList"></div>
  </section>
  <section id="s-orders"><div id="ordersList"></div></section>
  <section id="s-admin">
    <h3>کارکنان (هر نفر یک کد)</h3>
    <div id="staffList"></div>
    <div class="frm"><input id="staffName" placeholder="اسم کارمند"><input id="staffPin" placeholder="کدش" inputmode="numeric"><button class="act" id="addStaffBtn">افزودن</button></div>
    <h3>کدهای ورود</h3>
    <button class="act ghost" id="chPinBtn">تغییر کد مدیر</button>
    <h3>مدیریت منو</h3>
    <div id="mngArea"></div>
    <h3>پایان روز</h3>
    <button class="act" id="endDayBtn" style="width:100%">پایان روز کاری و ثبت گزارش</button>
  </section>
  <section id="s-report">
    <div id="repSum"></div>
    <h3>جزئیات سفارش‌های امروز</h3>

    <button class="act ghost" id="repDetBtn" style="width:100%"></button>
    <div id="repDetList" style="display:none"></div>
    <h3>گزارش روزهای قبل (آرشیو)</h3>
    <div id="repArc"></div>
    <button class="act danger" id="purgeBtn" style="width:100%;margin-top:12px">حذف آرشیوهای قدیمی‌تر از ۳۰ روز</button>
  </section>
</main>
<div id="cartBar"></div>
<div class="ov" id="cartOv"><div class="sheet" id="cartSheet"></div></div>
<div class="ov" id="tableOv"><div class="sheet" id="tableSheet"></div></div>
<div class="ov" id="editOv"><div class="sheet" id="editSheet"></div></div>
<div class="ov" id="themeOv"><div class="loginBox" id="themeBox"></div></div>
<div class="ov center show" id="loginOv"><div class="loginBox">
  <h2 style="font-size:1.1rem">ورود به کافه روبیک</h2>
  <p class="muted" style="margin-top:6px">کد ورود را وارد کنید</p>
  <input id="loginPin" inputmode="numeric" maxlength="8" placeholder="----">
  <div id="loginErr" style="color:var(--bad);font-size:.8rem;min-height:18px;margin-top:6px"></div>
  <button class="act" id="loginBtn" style="width:100%">ورود</button>
</div></div>
<script>
const SUPA_URL='https://dkmgewadohmnspkueodi.supabase.co';
const SUPA_KEY='sb_publishable_1IKt1YXof1LUaVeM5VDgpQ_vb8QqjnJ';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const $=s=>document.querySelector(s);
const TABLE_COUNT=15;
let role=localStorage.getItem('cafeRole')||'';
let userName=localStorage.getItem('cafeUser')||'';
let soundOn=localStorage.getItem('cafeSoundOn')!=='0';
let adminPin='1396',extraCats=[],staffPinLegacy='';
let menuRows=[],orders=[],staffList=[];
let cart=[],currentCat=null,currentTable=null;
let editId=null,editItems=[],repFilter={who:null,table:null},repDetOpen=false,arcOpenDay=null;
let prevStatus={},inited=false;
const fmt=n=>(n*1000).toLocaleString('fa-IR');
const hhmm=d=>new Date(d).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
const faDate=d=>new Date(d).toLocaleDateString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'});
function parseItems(o){try{return (JSON.parse(o.items||'[]')).map(it=>({name:it.name||it.n||'',price:Number(it.price!=null?it.price:(it.p!=null?it.p:0)),qty:Number(it.qty||it.q||1),note:it.note||it.t||''}));}catch(e){return[];}}
const orderTotal=o=>parseItems(o).reduce((s,it)=>s+it.qty*(it.price||0),0);
function showToast(msg){const b=$('#banner');b.textContent=msg;b.style.display='block';clearTimeout(b._t);b._t=setTimeout(()=>b.style.display='none',6000);}
function todayOrders(){const t=new Date().toDateString();return orders.filter(o=>o.created_at&&new Date(o.created_at).toDateString()===t);}
function activeOrders(){return orders.filter(o=>!o.archived&&o.status!=='done');}
let actx=null;
function ensureAudio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return false;}}if(actx.state==='suspended')actx.resume();return true;}
function tone(f,d,dur,vol){const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(vol||.6,actx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d+dur);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+dur+.05);}
function playSound(k){if(!soundOn||!ensureAudio())return;try{if(k==='new'){tone(880,0,.22);tone(1175,.2,.3);tone(1568,.42,.4,.5);}else{tone(988,0,.18);tone(784,.18,.18);tone(1319,.36,.45,.55);}}catch(e){}}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function setTheme(t){document.body.className='theme-'+t;localStorage.setItem('cafeTheme',t);}
function openTheme(){const box=$('#themeBox');box.innerHTML='<b style="font-size:.95rem">انتخاب تم</b><div style="display:grid;gap:8px;margin-top:12px">'
 +[['dark','مشکی-نارنجی','#0b0b0b'],['light','سفید کافه‌ای','#f7f3ee'],['orange','نارنجی شیک','#fff3e8'],['blue','آبی شیک','#f2f6fa']].map(x=>'<button class="act ghost" data-t="'+x[0]+'" style="display:flex;align-items:center;gap:10px;justify-content:flex-start"><span style="width:18px;height:18px;border-radius:50%;background:'+x[2]+';border:1px solid var(--line);display:inline-block"></span>'+x[1]+'</button>').join('')+'</div>';
 box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{setTheme(b.dataset.t);$('#themeOv').classList.remove('show');});
 $('#themeOv').classList.add('show');}
$('#themeOv').onclick=e=>{if(e.target.id==='themeOv')$('#themeOv').classList.remove('show');};
async function loadSettings(){try{const{data}=await sb.from('cafe_settings').select('*');(data||[]).forEach(r=>{if(r.key==='admin_pin')adminPin=r.value;try{if(r.key==='extra_cats')extraCats=JSON.parse(r.value||'[]');}catch(e){}});}catch(e){}}
async function loadStaff(){try{const{data}=await sb.from('cafe_staff').select('*').order('id');staffList=data||[];}catch(e){staffList=[];}}
async function loadMenu(){try{const{data}=await sb.from('cafe_menu').select('*').order('id');menuRows=data||[];if(role)renderCats(),renderMenuList();}catch(e){}}
async function fetchOrders(){try{const{data}=await sb.from('cafe_orders').select('*').order('id',{ascending:false}).limit(300);orders=data||[];
 if(inited){
   const seen=new Date(localStorage.getItem('cafeLastSeen')||0);
   const fresh=orders.filter(o=>o.status==='new'&&!o.archived&&o.who!==userName&&new Date(o.created_at)>seen);
   if(fresh.length){playSound('new');vib([250,120,250,120,250]);showToast(fresh.length+' سفارش جدید! '+(fresh.length<=3?fresh.map(o=>'میز '+o.table_id).join('، '):''));}
   orders.forEach(o=>{if(prevStatus[o.id]&&prevStatus[o.id]!=='done'&&o.status==='done'){playSound('done');vib([120,80,120]);showToast('سفارش میز '+o.table_id+' تحویل شد');}prevStatus[o.id]=o.status;});
 }
 const mx=orders.reduce((m,o)=>o.created_at&&new Date(o.created_at)>m?new Date(o.created_at):m,new Date(localStorage.getItem('cafeLastSeen')||0));
 localStorage.setItem('cafeLastSeen',mx.toISOString());
 if(inited){renderDash();renderTables();renderOrders();if(role==='admin'&&$('#s-report').classList.contains('show'))renderReport();}
}catch(e){}}
function buildNav(){const tabs=[['tables','میزها'],['menu','منو'],['orders','سفارش‌ها']];if(role==='admin'){tabs.push(['admin','مدیریت'],['report','گزارش']);}
 $('#nav').innerHTML=tabs.map(t=>'<button data-t="'+t[0]+'" class="'+($('#nav').dataset.cur===t[0]?'active':'')+'">'+t[1]+'</button>').join('');
 $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
 $('#dash').style.display=role?'grid':'none';}
function showTab(id){$('#nav').dataset.cur=id;document.querySelectorAll('main section').forEach(s=>s.classList.remove('show'));$('#s-'+id).classList.add('show');
 $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.t===id));
 if(id==='tables'){renderDash();renderTables();}if(id==='orders')renderOrders();if(id==='menu'){renderCats();renderMenuList();}if(id==='admin'&&role==='admin')renderAdmin();if(id==='report'&&role==='admin')renderReport();}
function renderDash(){const act=activeOrders();const occ=new Set(act.map(o=>o.table_id)).size;const sum=todayOrders().reduce((s,o)=>s+orderTotal(o),0);
 $('#dash').innerHTML='<div class="chip">میز آزاد<b>'+(TABLE_COUNT-occ)+'</b></div>'
 +'<div class="chip">میز اشغال<b>'+occ+'</b></div>'
 +'<div class="chip">سفارش فعال<b>'+act.length+'</b></div>'
 +'<div class="chip">فروش امروز<b>'+fmt(sum)+'</b></div>';}
function renderTables(){const act=activeOrders();const byT={};act.forEach(o=>{(byT[o.table_id]=byT[o.table_id]||[]).push(o);});
 let h='';for(let i=1;i<=TABLE_COUNT;i++){const list=(byT[i]||[]);const occ=list.length>0;
  let sub='آزاد';if(occ){const old=list.reduce((m,o)=>new Date(o.created_at)<m?new Date(o.created_at):m,new Date(list[0].created_at));const mins=Math.floor((Date.now()-old)/60000);sub=list.length+' سفارش · '+mins+' دقیقه';}
  h+='<div class="tcard'+(occ?' occ':'')+'" data-t="'+i+'"><div class="tn">میز '+i+'</div><div class="ts">'+sub+'</div></div>';}
 $('#tgrid').innerHTML=h;$('#tgrid').querySelectorAll('.tcard').forEach(c=>c.onclick=()=>{const t=+c.dataset.t;(byT[t]||[]).length?openTableSheet(t):startOrder(t);});}
function openTableSheet(t){const act=orders.filter(o=>!o.archived&&o.table_id===t);
 $('#tableSheet').innerHTML='<b>میز '+t+'</b><div style="margin:10px 0">'+(act.length?act.map(o=>'<div class="row"><span>'+hhmm(o.created_at)+' · '+parseItems(o).length+' آیتم · <b style="color:var(--accent)">'+fmt(orderTotal(o))+'</b> · '+(o.status==='new'?'جدید':'در حال آماده‌سازی')+'</span></div>').join(''):'<span class="muted">سفارش فعالی ندارد</span>')+'</div>'
 +'<div style="display:grid;gap:8px"><button class="act" id="tsAdd">سفارش جدید برای این میز</button>'
 +(orders.some(o=>o.table_id===t)?'<button class="act ghost" id="tsRep">تکرار سفارش قبلی این میز</button>':'')+'</div>';
 $('#tsAdd').onclick=()=>{$('#tableOv').classList.remove('show');startOrder(t);};
 const r=$('#tsRep');if(r)r.onclick=()=>{const last=orders.filter(o=>o.table_id===t).sort((a,b)=>b.id-a.id)[0];cart=parseItems(last);currentTable=t;$('#tableOv').classList.remove('show');showTab('menu');openCart();};
 $('#tableOv').classList.add('show');}

 const late=o.status!=='done'&&mins>=5;
 const btns=o.status==='new'?'<button class="act" data-act="prep" data-id="'+o.id+'">شروع آماده‌سازی</button>'
  :o.status==='preparing'?'<button class="act" data-act="done" data-id="'+o.id+'">تحویل شد</button>':'';

 +(late?'<div class="warn" style="font-size:.75rem;margin-top:4px">معطل '+mins+' دقیقه!</div>':'')

  $('#repDetList').querySelectorAll('.repRow').forEach(r=>r.onclick=()=>{repFilter.who=r.dataset.w;repFilter.table=r.dataset.t;renderReport();});}

 inited=true;
 setInterval(fetchOrders,3500);
 setInterval(()=>{if(!document.hidden)loadMenu();},15000);
 setInterval(()=>{loadSettings();loadStaff();},60000);
})();
</script>

<script>
/* ===== پچ اصلاحی ===== */
function startOrder(t){currentTable=t;cart=[];showToast('میز '+t+' انتخاب شد — سفارش بگیر');showTab('menu');}
function ensureTable(cb){if(currentTable!=null){cb();return;}
 const s=$('#tableSheet');s.innerHTML='<b>سفارش برای کدام میز؟</b><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px">'+Array.from({length:TABLE_COUNT},(_,i)=>'<button class="act ghost" data-pt="'+(i+1)+'">میز '+(i+1)+'</button>').join('')+'</div>';
 s.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{currentTable=+b.dataset.pt;$('#tableOv').classList.remove('show');cb();});
 $('#tableOv').classList.add('show');}
function renderTables(){const act=activeOrders();const byT={};act.forEach(o=>{(byT[o.table_id]=byT[o.table_id]||[]).push(o);});
 let h='';for(let i=1;i<=TABLE_COUNT;i++){const list=(byT[i]||[]);const occ=list.length>0;
  let sub='آزاد';if(occ){const old=list.reduce((m,o)=>new Date(o.created_at)<m?new Date(o.created_at):m,new Date(list[0].created_at));const mins=Math.floor((Date.now()-old)/60000);sub=list.length+' سفارش · '+mins+' دقیقه';}
  h+='<div class="tcard'+(occ?' occ':'')+'" data-t="'+i+'"><div class="tn">میز '+i+'</div><div class="ts">'+sub+'</div></div>';}
 $('#tgrid').innerHTML=h;
 $('#tgrid').querySelectorAll('.tcard').forEach(c=>c.onclick=()=>{const t=+c.dataset.t;(byT[t]||[]).length?openTableSheet(t):startOrder(t);});}
function renderCats(){const cats=allCats();
 if(!currentCat||!cats.includes(currentCat))currentCat=cats[0]||null;
 $('#catCircles').innerHTML=cats.map(c=>'<button class="circ'+(c===currentCat?' active':'')+'" data-c="'+c+'">'+c+'</button>').join('');
 $('#catCircles').querySelectorAll('.circ[data-c]').forEach(b=>b.onclick=()=>{currentCat=b.dataset.c;renderCats();renderMenuList();});}
function renderMng(){const box=$('#mngArea');
 if(!currentCat){const cats=allCats();
  box.innerHTML='<div class="muted" style="text-align:center;margin-bottom:10px">برای مدیریت، یک دسته را انتخاب کنید:</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">'+cats.map(c=>'<button class="circ" data-c="'+c+'">'+c+'</button>').join('')+'<button class="circ" id="addCatBtn" style="border-style:dashed">+ دسته جدید</button></div>';
  box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{currentCat=b.dataset.c;renderMng();});
  $('#addCatBtn').onclick=addCat;return;}
 const items=menuRows.filter(r=>r.cat===currentCat);
 box.innerHTML='<button class="act ghost" id="backCats" style="margin-bottom:10px">برگشت به دسته‌ها</button><div class="muted" style="margin-bottom:8px">دسته: <b style="color:var(--accent)">'+currentCat+'</b></div>'
 +(items.length?items.map(r=>'<div class="row"><span>'+r.name+' · '+(r.price!=null?fmt(r.price):'—')+(r.soldout?' · <span class="badge">ناموجود</span>':'')+'</span><span class="btns"><button class="mini" data-me="'+r.id+'">ویرایش</button><button class="mini" data-ms="'+r.id+'">'+(r.soldout?'موجود شد':'ناموجود')+'</button><button class="mini rd" data-md="'+r.id+'">حذف</button></span></div>').join(''):'<div class="muted">آیتمی در این دسته نیست</div>')
 +'<div class="frm"><input id="addName" placeholder="نام آیتم جدید"><input id="addPrice" placeholder="قیمت (هزار تومان)" inputmode="numeric"><button class="act" id="addItemBtn">افزودن</button></div>';
 $('#backCats').onclick=()=>{currentCat=null;renderMng();};
 $('#addItemBtn').onclick=addItem;
 box.querySelectorAll('[data-me]').forEach(b=>b.onclick=()=>{const r=menuRows.find(x=>x.id==+b.dataset.me);const nn=prompt('اسم جدید:',r.name);if(nn===null)return;const np=prompt('قیمت جدید (هزار تومان، خالی=بدون قیمت):',r.price==null?'':r.price);if(np===null)return;sb.from('cafe_menu').update({name:nn.trim(),price:np.trim()===''?null:Number(np)}).eq('id',r.id).then(loadMenu);});
 box.querySelectorAll('[data-ms]').forEach(b=>b.onclick=()=>{const r=menuRows.find(x=>x.id==+b.dataset.ms);sb.from('cafe_menu').update({soldout:!r.soldout}).eq('id',r.id).then(loadMenu);});
 box.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{if(confirm('حذف شود؟'))sb.from('cafe_menu').delete().eq('id',+b.dataset.md).then(loadMenu);});}
function openCart(){if(!cart.length)return;
 if(currentTable==null){ensureTable(()=>{renderCart();$('#cartOv').classList.add('show');});return;}
 renderCart();$('#cartOv').classList.add('show');}
async function addCat(){const c=prompt('اسم دسته جدید:');if(!c)return;extraCats.push(c.trim());
 await sb.from('cafe_settings').upsert({key:'extra_cats',value:JSON.stringify(extraCats)});
 currentCat=c.trim();renderCats();renderMng();showToast('دسته «'+c.trim()+'» اضافه شد');}
</script>
<script>
/* ===== پچ ثبت سفارش ===== */
async function submitOrder(){if(!cart.length||!currentTable)return;const btn=$('#cartSubmit');btn.disabled=true;
 const base={table_id:currentTable,items:JSON.stringify(cart),status:'new'};
 const tries=[Object.assign({note:'',who:userName},base),Object.assign({note:'',created_by:userName},base),base];
 let lastErr=null;
 for(const payload of tries){
  const{error}=await sb.from('cafe_orders').insert(payload);
  if(!error){lastErr=null;break;}
  lastErr=error;
 }
 btn.disabled=false;
 if(lastErr){showToast('خطا: '+(lastErr.message||'نامشخص'));return;}
 cart=[];$('#cartOv').classList.remove('show');updateCartBar();showToast('سفارش میز '+currentTable+' ثبت شد');fetchOrders();showTab('tables');}
</script>
