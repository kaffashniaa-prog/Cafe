<body>

<header>
  <h1>☕ کافه روبیک</h1>
  <button id="soundBtn">🔔 فعال‌سازی صدا</button>
  <span id="conn">در حال اتصال...</span>
</header>

<nav>
  <button data-tab="tables">🪑 میزها</button>
  <button data-tab="menu">📋 منو</button>
  <button data-tab="orders">🧾 سفارش‌ها <span id="ordersBadge"></span></button>
  <button data-tab="manage">⚙️ مدیریت</button>
</nav>

<main>
  <section id="tab-tables"><div id="tablesGrid"></div></section>

  <section id="tab-menu">
    <div id="menuWarn">⛔ جدول منو در دیتابیس در دسترس نیست — اول SQL جدول منو را در Supabase اجرا کن.</div>
    <div id="tableBar"></div>
    <div id="cats"></div>
    <input id="search" placeholder="🔍 جستجو در کل منو...">
    <div id="menuGrid"></div>
    <div id="cartBox">
      <h3>🛒 سبد سفارش</h3>
      <div id="cartItems"></div>
      <input id="orderNote" placeholder="توضیحات سفارش (اختیاری) — مثلا: بدون شکر">
      <button id="submitBtn" disabled>ثبت سفارش</button>
    </div>
  </section>

  <section id="tab-orders">
    <div id="ordersList"></div>
    <button id="resetBtn">🧹 پاک‌سازی همه سفارش‌ها (پایان روز)</button>
  </section>

  <section id="tab-manage">
    <div class="mng-hint">⚙️ تغییرات منو بلافاصله برای همه اعمال می‌شود. قیمت‌ها به «هزار تومان» (خالی = توافقی).</div>
    <div id="manageList"></div>
    <div id="addBox">
      <h3>➕ افزودن آیتم جدید</h3>
      <select id="addCat"></select>
      <input id="addNewCat" placeholder="نام دسته جدید" style="display:none">
      <input id="addName" placeholder="نام آیتم (مثلا: چای ماسالا)">
      <input id="addPrice" inputmode="numeric" placeholder="قیمت به هزار تومان (خالی = توافقی)">
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.9rem"><input type="checkbox" id="addSold"> ناموجود است</label>
      <button id="addBtn">➕ افزودن به منو</button>
    </div>
  </section>
</main>

<script>
/* ===== تنظیمات ===== */
const SUPA_URL = 'https://dkmgewadohmnspkueodi.supabase.co';
const SUPA_KEY = 'sb_publishable_1IKt1YXof1LUaVeM5VDgpQ_vb8QqjnJ';
const ADMIN_PIN = '1234';
const TABLE_COUNT = 15;

const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

const DEFAULT_MENU = [
 {cat:'قهوه‌ها', items:[
  ['اسپرسو سینگل',140],['اسپرسو دبل',170],['آمریکانو سینگل',145],['آمریکانو دبل',175],
  ['اسپرسو عربیکا',200],['چیلی',175],['لته سینگل',210],['لته دبل',240],
  ['کاپوچینو سینگل شات',210],['کاپوچینو دبل شات',240],['کارامل ماکیاتو',255],['موکا',255],
  ['ترک',180],['آیس آمریکانو',150],['آیس لته',245],['هایپ اسپرسو',270],
  ['آفوگاتو',230],['آیس لته کارامل',260],['کافی کولا',255],['آیس کارامل ماکیاتو',260],['لمون کافی',280]]},
 {cat:'موج سوم', items:[
  ['کمکس تک کاپ',250],['کمکس دوبل کاپ',440],['سایفون تک کاپ',250],['سایفون دوبل کاپ',440],['فرنچ پرس',225]]},
 {cat:'گرم‌نوش', items:[
  ['چای ماسالا',260],['هات چاکلت',260],['هات فندقی',280],['وایت چاکلت',260],
  ['شیر نسکافه',260],['شیرعسل دارچین',270],['هات نوتلا',285],['پینک چاکلت',280]]},
 {cat:'دمنوش‌ها', items:[
  ['عطر آرامش',155],['اسپایسی چای ترش',155],['سیب دارچین',175],['لیمو نعنا عسلی',165],
  ['لبخند یلدا',160],['راز بنفش',170],['دل آرام',150],['چای لیوانی',85],['چای با فرنچ پرس',110]]},
 {cat:'خوراک', items:[
  ['لازانیا گوشت',490],['لازانیا مرغ',460],['پنینی روبو اسپشیال',480],['پنینی چیکن آلفردو',455],
  ['پنینی گوشت',500],['ماشروم برگر',510],['برگر کلاسیک',420],['پاستا آلفردو',410],
  ['اسنک روبیک ۸ تکه',480],['اسنک روبیک ۶ تکه',370],['اسنک روبیک ۴ تکه',295],
  ['سیب‌زمینی با سس قارچ',370],['سیب‌زمینی مخصوص روبیک',480],['چیپس و پنیر',360],['سیب‌زمینی تنوری ساده',250]]},
 {cat:'سالاد', items:[['سالاد سزار',450]]},
 {cat:'میان‌وعده', items:[
  ['کرپ نوتلا',230],['کرپ بنفی',310],['کرپ موز توت‌فرنگی',295],['پنکیک نوتلا',230],
  ['پنکیک موز نوتلا',275],['پنکیک موز توت‌فرنگی',295],['پنکیک مخصوص با بستنی',340],
  ['مینی پنکیک ساده با چای',295],['مینی پنکیک مخصوص با بستنی',295],['کرپ مافین اسپشیال',300]]},
 {cat:'کیک روز', items:[['کیک شکلاتی',105,1],['کیک تریلیچه',150,1]]},
 {cat:'خنکی‌جات', items:[
  ['موروکو',190],['ملودی',200],['هانی‌بری',185],['الی',195],['سیما',180],
  ['موهیتو',150],['کرش موهیتو',180],['برنارد',195],['لیموناد',150]]},
 {cat:'بستنی', items:[
  ['روبو بامبی',225],['کیک بستنی ویژه',305],['کیک بستنی',225],['کیک بستنی شکلاتی',240],['کیک بستنی میوه‌ای',240]]},
 {cat:'سردنوش', items:[['طلای آرام',240],['عطر بهشت',195],['نفس آبی',195],['ماه چین',195]]},
 {cat:'شیک', items:[
  ['تروبانا',325],['لتو بری',325],['چوکونات',315],['پیناتلا',355],['پرشین شیک',330],
  ['شیک نوتلا',305],['شیک کره بادام‌زمینی',295],['شیک توت‌فرنگی',290],['شیک شکلات',285]]},
 {cat:'صبحانه', items:[
  ['سینی روبیک',400],['بشقاب انگلیسی',380],['سینی دلخواه',null],
  ['املت اسفناج',180],['املت قارچ و پنیر',220],['املت ایرانی',160]]}
];

let orders = [], menuRows = [], menuSig = '', menuError = false;
let online = false, cart = [], currentTable = null, currentCat = null, searchTerm = '', currentTab = 'tables';
let knownOrderIds = null;   // برای تشخیص سفارش/تحویل جدید
let soundReady = false;

const $ = s => document.querySelector(s);
const fmt = p => p==null ? 'توافقی' : (p*1000).toLocaleString('fa-IR')+' تومان';
const sum = arr => (arr||[]).reduce((n,i)=> n + (i.p==null ? 0 : i.p*i.qty), 0) * 1000;
const cats = () => [...new Set(menuRows.map(r=>r.cat))];

/* ===== صدا (Web Audio، بدون فایل) ===== */
function tone(freq, delay, dur){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type='sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001, actx.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(0.4, actx.currentTime+delay+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+delay+dur);
  o.connect(g).connect(actx.destination);
  o.start(actx.currentTime+delay); o.stop(actx.currentTime+delay+dur+0.05);
}
let actx = null;
function playSound(kind){
  if(!soundReady || !actx) return;
  try{
    if(kind==='new'){ tone(880,0,.15); tone(1175,.18,.25); }        // دینگ
    else{ tone(988,0,.12); tone(784,.14,.12); tone(1319,.28,.3); }  // دینگ‌دونگ تحویل
  }catch(e){}
}
function unlockSound(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
  if(actx.state==='suspended') actx.resume();
  soundReady = true;
  localStorage.setItem('cafeSoundOn','1');
  $('#soundBtn').style.display='none';
}
if(localStorage.getItem('cafeSoundOn')==='1'){ soundReady = true; }

/* ===== منو ===== */
async function loadMenu(){
  try{
    let {data, error} = await sb.from('cafe_menu').select('*').order('id');
    if(error) throw error;
    if(data && !data.length){
      const rows=[];
      DEFAULT_MENU.forEach(g=>g.items.forEach(it=>rows.push({cat:g.cat, name:it[0], price:it[1], soldout:!!it[2]})));
      const ins = await sb.from('cafe_menu').insert(rows);
      if(ins.error) throw ins.error;
      ({data, error} = await sb.from('cafe_menu').select('*').order('id'));
      if(error) throw error;
    }
    const sig = JSON.stringify(data);
    if(sig !== menuSig){
      menuSig = sig; menuRows = data || [];
      if(currentTab==='menu') renderMenu();
      if(currentTab==='manage') renderManage();
    }
    menuError = false;
  }catch(e){ menuError = true; }
  const w = $('#menuWarn'); if(w) w.style.display = menuError ? 'block' : 'none';
}

/* ===== سفارش‌ها + تشخیص صدایی ===== */
async function fetchOrders(){
  try{
    const {data, error} = await sb.from('cafe_orders').select('*').order('id');
    if(error) throw error;
    const fresh = data || [];
    if(knownOrderIds !== null && online){
      fresh.forEach(o=>{
        if(!knownOrderIds.has(o.id)) playSound('new');                    // سفارش جدید
        else if(o.status==='done' && !prevDone.has(o.id)) playSound('done'); // تحویل
      });
    }
    prevDone = new Set(fresh.filter(o=>o.status==='done').map(o=>o.id));
    knownOrderIds = new Set(fresh.map(o=>o.id));
    orders = fresh; online = true;
  }catch(e){ online = false; }
  const c = $('#conn');
  c.textContent = online ? '✅ متصل' : '🔴 بدون اتصال';
  c.className = online ? 'ok' : '';
  if(currentTab==='tables') renderTables();
  if(currentTab==='orders') renderOrders();
  const badge = orders.filter(o=>o.status!=='done').length;
  $('#ordersBadge').textContent = badge ? badge : '';
}
let prevDone = new Set();

/* ===== تب‌ها ===== */
function askPin(){ return prompt('کد مدیریت را وارد کن:') === ADMIN_PIN; }
function showTab(name){
  currentTab = name;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('main > section').forEach(s=>s.classList.toggle('show', s.id==='tab-'+name));
  if(name==='tables') renderTables();
  if(name==='menu')   renderMenu();
  if(name==='orders') renderOrders();
  if(name==='manage') renderManage();
}

/* ===== میزها ===== */
function renderTables(){
  const el = $('#tablesGrid'); el.innerHTML='';
  for(let i=1;i<=TABLE_COUNT;i++){
    const open = orders.filter(o=>o.table_id===i && o.status!=='done').length;
    const d = document.createElement('div');
    d.className = 'table-card' + (open?' busy':'');
    d.innerHTML = `<b>میز ${i}</b><span>${open ? open+' سفارش فعال' : 'آزاد'}</span>`;
    d.onclick = ()=>{ currentTable=i; cart=[]; showTab('menu'); };
    el.appendChild(d);
  }
}

/* ===== منو (نمایش) ===== */
function renderMenu(){
  const cs = cats();
  if(!cs.includes(currentCat)) currentCat = cs[0] || '';
  const bar = $('#tableBar');
  bar.innerHTML = currentTable
    ? `<span>میز فعال: <b>میز ${currentTable}</b></span><button onclick="currentTable=null;cart=[];renderMenu()">تغییر میز</button>`
    : `<span>⚠️ اول از تب «میزها» یک میز انتخاب کن</span>`;

  const catsEl = $('#cats'); catsEl.innerHTML='';
  cs.forEach(c=>{
    const b=document.createElement('button');
    b.textContent=c;
    b.className='cat'+(c===currentCat?' active':'');
    b.onclick=()=>{ currentCat=c; searchTerm=''; $('#search').value=''; renderMenu(); };
    catsEl.appendChild(b);
  });

  const grid=$('#menuGrid'); grid.innerHTML='';
  const rows = searchTerm ? menuRows.filter(r=>r.name.includes(searchTerm)) : menuRows.filter(r=>r.cat===currentCat);
  if(!rows.length) grid.innerHTML='<p class="muted">آیتمی نیست</p>';
  rows.forEach(r=>{
    const c=document.createElement('div'); c.className='item'+(r.soldout?' unavail':'');
    const info=document.createElement('div');
    info.innerHTML=`<span class="iname">${r.name}</span>${searchTerm?`<span class="icat">${r.cat}</span>`:''}<span class="iprice">${fmt(r.price)}</span>`;
    c.appendChild(info);
    if(r.soldout){ const s=document.createElement('span'); s.className='soldout'; s.textContent='ناموجود'; c.appendChild(s); }
    else{
      const btn=document.createElement('button'); btn.textContent='+'; btn.onclick=()=>addToCart(r.name, r.price);
      c.appendChild(btn);
    }
    grid.appendChild(c);
  });
  renderCart();
}

/* ===== سبد ===== */
function addToCart(name, price){
  if(!currentTable){ alert('اول یک میز انتخاب کن'); showTab('tables'); return; }
  const it = cart.find(i=>i.name===name);
  it ? it.qty++ : cart.push({name, p:price, qty:1});
  renderCart();
}
function changeQty(name, delta){
  const i = cart.findIndex(x=>x.name===name);
  if(i<0) return;
  cart[i].qty += delta;
  if(cart[i].qty<=0) cart.splice(i,1);
  renderCart();
}
function renderCart(){
  const el=$('#cartItems');
  if(!cart.length){
    el.innerHTML='<p class="muted">سبد خالی است</p>';
    $('#submitBtn').disabled=true;
    return;
  }
  el.innerHTML='';
  cart.forEach(i=>{
    const r=document.createElement('div'); r.className='cart-row';
    const t=document.createElement('div');
    t.innerHTML=`<span>${i.name}</span><small>${i.p==null?'':fmt(i.p*i.qty)}</small>`;
    const q=document.createElement('span'); q.className='qty';
    const minus=document.createElement('button'); minus.textContent='−'; minus.onclick=()=>changeQty(i.name,-1);
    const plus=document.createElement('button'); plus.textContent='+'; plus.onclick=()=>changeQty(i.name,1);
    q.append(minus, document.createTextNode(i.qty), plus);
    r.append(t,q);
    el.appendChild(r);
  });
  const tot=document.createElement('div'); tot.className='cart-row'; tot.id='totalRow';
  tot.innerHTML=`<span>جمع کل</span><span>${sum(cart).toLocaleString('fa-IR')} تومان</span>`;
  el.appendChild(tot);
  $('#submitBtn').disabled=false;
}

/* ===== ثبت سفارش ===== */
async function submitOrder(){
  if(!currentTable || !cart.length) return;
  const btn=$('#submitBtn'); btn.disabled=true; btn.textContent='در حال ثبت...';
  const {error} = await sb.from('cafe_orders').insert({
    table_id: currentTable, items: cart, note: $('#orderNote').value.trim(), status: 'new'
  });
  btn.disabled=false; btn.textContent='ثبت سفارش';
  if(error){ alert('خطا در ثبت! اینترنت را چک کن و دوباره بزن.'); renderCart(); return; }
  cart=[]; $('#orderNote').value='';
  await fetchOrders();
  showTab('orders');
}

/* ===== سفارش‌ها (نمایش) ===== */
function renderOrders(){
  const el=$('#ordersList'); el.innerHTML='';
  const byTable = {};
  orders.forEach(o=>{ (byTable[o.table_id] = byTable[o.table_id] || []).push(o); });
  const tids = Object.keys(byTable).sort((a,b)=>a-b);
  if(!tids.length){ el.innerHTML='<p class="muted">هنوز سفارشی ثبت نشده است.</p>'; return; }
  tids.forEach(tid=>{
    const list = byTable[tid];
    const box=document.createElement('div'); box.className='order-box';
    const allDone = list.every(o=>o.status==='done');
    const h=document.createElement('h3');
    h.innerHTML=`<span>🪑 میز ${tid}</span>`;
    if(allDone){
      const f=document.createElement('button'); f.className='free'; f.textContent='آزادسازی میز';
      f.onclick=()=>freeTable(tid);
      h.appendChild(f);
    }
    box.appendChild(h);
    list.forEach(o=>box.appendChild(orderCard(o)));
    el.appendChild(box);
  });
}
function orderCard(o){
  const labels={new:'🆕 جدید', preparing:'⏳ در حال آماده‌سازی', done:'✅ تحویل شد'};
  const nextBtn={new:'شروع آماده‌سازی', preparing:'تحویل شد ✅', done:null};
  const d=document.createElement('div'); d.className='order status-'+o.status;
  const time = new Date(o.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
  d.innerHTML=`<div class="ohead"><b>سفارش #${o.id}</b><span>${time}</span></div>
    <ul>${(o.items||[]).map(i=>`<li><span>${i.name} × ${i.qty}</span><span>${i.p==null?'توافقی':fmt(i.p*i.qty)}</span></li>`).join('')}</ul>
    ${o.note?`<p class="note">📝 ${o.note}</p>`:''}
    <div class="ototal"><span>جمع کل</span><span>${sum(o.items).toLocaleString('fa-IR')} تومان</span></div>
    <span class="badge">${labels[o.status]||o.status}</span>`;
  if(nextBtn[o.status]){
    const b=document.createElement('button'); b.textContent=nextBtn[o.status];
    b.onclick=()=>advance(o.id, o.status);
    d.appendChild(b);
  }
  return d;
}
async function advance(id, status){
  const next = status==='new' ? 'preparing' : 'done';
  await sb.from('cafe_orders').update({status: next}).eq('id', id);
  fetchOrders();
}
async function freeTable(tid){
  if(!confirm('همه سفارش‌های میز '+tid+' پاک شود؟')) return;
  await sb.from('cafe_orders').delete().eq('table_id', tid);
  fetchOrders();
}

/* ===== مدیریت منو ===== */
function renderManage(){
  const list=$('#manageList'); list.innerHTML='';
  cats().forEach(c=>{
    const box=document.createElement('div'); box.className='mcat';
    const h=document.createElement('h3'); h.textContent='📂 '+c;
    box.appendChild(h);
    menuRows.filter(r=>r.cat===c).forEach(r=>{
      const row=document.createElement('div'); row.className='mrow';
      const nm=document.createElement('div'); nm.className='nm';
      nm.innerHTML=`<span>${r.name}</span><span class="pr">${fmt(r.price)}</span>${r.soldout?'<span class="so">⛔ ناموجود</span>':''}`;
      const ops=document.createElement('div'); ops.className='ops';
      const mk=(txt,fn,cls)=>{ const b=document.createElement('button'); b.textContent=txt; if(cls)b.className=cls; b.onclick=fn; return b; };
      ops.appendChild(mk('✏️', ()=>editItem(r)));
      ops.appendChild(mk(r.soldout?'✅':'🚫', ()=>mUpdate(r.id,{soldout:!r.soldout})));
      ops.appendChild(mk('🗑', ()=>delItem(r), 'del'));
      row.append(nm, ops);
      box.appendChild(row);
    });
    list.appendChild(box);
  });
  const sel=$('#addCat');
  const prev=sel.value;
  sel.innerHTML='';
  cats().forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent='دسته: '+c; sel.appendChild(o); });
  const o=document.createElement('option'); o.value='__new'; o.textContent='➕ دسته جدید';
  sel.appendChild(o);
  if(prev) sel.value=prev;
}
async function mUpdate(id, fields){
  const {error} = await sb.from('cafe_menu').update(fields).eq('id', id);
  if(error) alert('خطا در ذخیره تغییرات');
  await loadMenu(); renderManage();
}
function editItem(r){
  const name = prompt('نام آیتم:', r.name);
  if(name===null) return;
  const ps = prompt('قیمت به هزار تومان (خالی = توافقی):', r.price==null ? '' : r.price);
  if(ps===null) return;
  const price = ps.trim()==='' || isNaN(parseInt(ps)) ? null : parseInt(ps);
  mUpdate(r.id, {name: name.trim()||r.name, price: price});
}
function delItem(r){
  if(!confirm('«'+r.name+'» از منو حذف شود؟')) return;
  sb.from('cafe_menu').delete().eq('id', r.id).then(()=>{ loadMenu(); renderManage(); });
}
async function addItem(){
  const name=$('#addName').value.trim();
  if(!name){ alert('نام آیتم را بنویس'); return; }
  let cat=$('#addCat').value;
  if(cat==='__new'){
    cat=$('#addNewCat').value.trim();
    if(!cat){ alert('نام دسته جدید را بنویس'); return; }
  }
  const ps=$('#addPrice').value.trim();
  const price = ps==='' || isNaN(parseInt(ps)) ? null : parseInt(ps);
  const {error} = await sb.from('cafe_menu').insert({cat, name, price, soldout: $('#addSold').checked});
  if(error){ alert('خطا در افزودن'); return; }
  $('#addName').value=''; $('#addPrice').value=''; $('#addSold').checked=false; $('#addNewCat').value='';
  await loadMenu(); renderManage();
}

/* ===== رویدادها ===== */
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick=()=>{ if(b.dataset.tab==='manage' && currentTab!=='manage' && !askPin()) return; showTab(b.dataset.tab); };
});
$('#submitBtn').onclick=submitOrder;
$('#search').oninput=e=>{ searchTerm=e.target.value.trim(); renderMenu(); };
$('#resetBtn').onclick=async()=>{
  if(!confirm('همه سفارش‌های امروز از دیتابیس پاک شود؟')) return;
  await sb.from('cafe_orders').delete().neq('id', 0);
  fetchOrders();
};
$('#addBtn').onclick=addItem;
$('#addCat').onchange=()=>{ $('#addNewCat').style.display = $('#addCat').value==='__new' ? 'block' : 'none'; };
$('#soundBtn').onclick=unlockSound;

/* ===== شروع ===== */
if(soundReady) $('#soundBtn').style.display='none';
else{ document.body.addEventListener('click', function once(){ unlockSound(); document.body.removeEventListener('click', once); }, {once:true}); }
fetchOrders();
loadMenu();
setInterval(fetchOrders, 3500);
setInterval(()=>{ if(!document.hidden) loadMenu(); }, 15000);
showTab('tables');
</script>
</body>
</html>
