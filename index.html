<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e1613">
<title>سفارش‌گیری کافه روبیک</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<link rel="manifest" href='data:application/manifest+json,{"name":"Cafe Rubik","short_name":"Cafe","start_url":".","display":"standalone","background_color":"%231e1613","theme_color":"%231e1613"}'>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0}
  body{font-family:Vazirmatn,Tahoma,sans-serif;background:#1e1613;color:#f5ede4;padding-bottom:40px}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#2b201a}
  header h1{font-size:1.1rem}
  #conn{font-size:.75rem;padding:4px 10px;border-radius:12px;background:#1e1613;color:#b7a08c}
  #conn.ok{color:#4caf7d}
  nav{display:flex;gap:8px;padding:10px 16px;background:#2b201a;position:sticky;top:0;z-index:5}
  nav button{flex:1;padding:10px;border:none;border-radius:10px;background:#3a2c24;color:#f5ede4;font-family:inherit;font-size:.95rem;cursor:pointer}
  nav button.active{background:#c98a4b;color:#1e1613;font-weight:bold}
  main{padding:16px}
  main section{display:none}
  main section.show{display:block}
  .muted{color:#b7a08c;font-size:.9rem;text-align:center;padding:20px}
  #tablesGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
  .table-card{background:#3a2c24;border:2px solid transparent;border-radius:14px;padding:18px 8px;text-align:center;cursor:pointer}
  .table-card b{display:block;font-size:1.1rem;margin-bottom:6px}
  .table-card span{font-size:.8rem;color:#b7a08c}
  .table-card.busy{border-color:#c98a4b}
  #tableBar{background:#3a2c24;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:.95rem}
  #tableBar button{background:none;border:1px solid #c98a4b;color:#c98a4b;border-radius:8px;padding:4px 10px;cursor:pointer;font-family:inherit}
  #cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .cat{padding:8px 14px;border:none;border-radius:20px;background:#3a2c24;color:#f5ede4;cursor:pointer;font-family:inherit;font-size:.85rem}
  .cat.active{background:#c98a4b;color:#1e1613;font-weight:bold}
  #search{width:100%;padding:10px 14px;border-radius:10px;border:none;background:#3a2c24;color:#f5ede4;font-family:inherit;margin-bottom:12px}
  #menuGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#3a2c24;border-radius:12px;padding:10px 12px}
  .iname{display:block;font-size:.9rem}
  .icat{display:block;color:#8f7a66;font-size:.72rem;margin-top:2px}
  .iprice{display:block;color:#e0b98a;font-size:.8rem;margin-top:4px}
  .item button{width:32px;height:32px;flex-shrink:0;border:none;border-radius:50%;background:#c98a4b;color:#1e1613;font-size:1.2rem;cursor:pointer;font-weight:bold}
  .item.unavail{opacity:.4}
  .soldout{color:#d06a5a;font-size:.75rem;flex-shrink:0}
  #cartBox{background:#2b201a;border-radius:14px;padding:14px}
  #cartBox h3{margin-bottom:10px;font-size:1rem}
  .cart-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:.95rem;gap:8px}
  .cart-row small{display:block;color:#e0b98a;font-size:.78rem}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:26px;height:26px;border:none;border-radius:8px;background:#3a2c24;color:#f5ede4;cursor:pointer;font-size:1rem}
  #totalRow{border-top:1px solid #3a2c24;margin-top:8px;padding-top:12px;font-weight:bold;font-size:1rem}
  #orderNote{width:100%;padding:10px;border-radius:10px;border:none;background:#3a2c24;color:#f5ede4;font-family:inherit;margin:10px 0}
  #submitBtn{width:100%;padding:12px;border:none;border-radius:10px;background:#4caf7d;color:#10241a;font-weight:bold;font-family:inherit;font-size:1rem;cursor:pointer}
  #submitBtn:disabled{background:#3a2c24;color:#7a6a5a;cursor:not-allowed}
  .order-box{background:#2b201a;border-radius:14px;padding:14px;margin-bottom:14px}
  .order-box h3{display:flex;justify-content:space-between;align-items:center;font-size:1rem;margin-bottom:10px}
  .order-box h3 .free{background:none;border:1px solid #d06a5a;color:#d06a5a;border-radius:8px;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:.8rem}
  .order{border-radius:10px;padding:10px 12px;margin-bottom:8px;border-right:4px solid #c98a4b;background:#3a2c24;font-size:.9rem}
  .order.status-preparing{border-right-color:#5a9bd0}
  .order.status-done{border-right-color:#4caf7d;opacity:.65}
  .ohead{display:flex;justify-content:space-between;margin-bottom:6px;color:#b7a08c;font-size:.8rem}
  .order ul{list-style:none;padding:0}
  .order li{display:flex;justify-content:space-between;padding:3px 0}
  .order .ototal{border-top:1px dashed #55432f;margin-top:6px;padding-top:6px;display:flex;justify-content:space-between;color:#e0b98a;font-weight:bold}
  .order .note{color:#e0b98a;font-size:.85rem;margin:4px 0}
  .badge{display:inline-block;padding:2px 10px;border-radius:12px;background:#1e1613;font-size:.75rem;margin:6px 0}
  .order>button{display:block;width:100%;margin-top:6px;padding:8px;border:none;border-radius:8px;background:#c98a4b;color:#1e1613;font-family:inherit;cursor:pointer;font-weight:bold}
</style>
</head>
<body>

<header>
  <h1>☕ کافه روبیک</h1>
  <span id="conn">در حال اتصال...</span>
</header>

<nav>
  <button data-tab="tables">🪑 میزها</button>
  <button data-tab="menu">📋 منو</button>
  <button data-tab="orders">🧾 سفارش‌ها <span id="ordersBadge"></span></button>
</nav>

<main>
  <section id="tab-tables"><div id="tablesGrid"></div></section>

  <section id="tab-menu">
    <div id="tableBar"></div>
    <div id="cats"></div>
    <input id="search" placeholder="🔍 جستجو در کل منو...">
    <div id="menuGrid"></div>
    <div id="cartBox">
      <h3>🛒 سبد سفارش</h3>
      <div id="cartItems"></div>
      <input id="orderNote" placeholder="توضیحات سفارش (اختیاری) — مثلا: بدون شکر">
      <button id="submitBtn" disabled>ثبت سفارش</button>
    </div>
  </section>

  <section id="tab-orders">
    <div id="ordersList"></div>
    <button id="resetBtn" style="width:100%;margin-top:8px;padding:10px;border:1px solid #d06a5a;color:#d06a5a;background:none;border-radius:10px;font-family:inherit;cursor:pointer">🧹 پاک‌سازی همه سفارش‌ها (پایان روز)</button>
  </section>
</main>

<script>
/* ===== اتصال به دیتابیس ===== */
const SUPA_URL = 'https://dkmgewadohmnspkueodi.supabase.co';
const SUPA_KEY = 'sb_publishable_1IKt1YXof1LUaVeM5VDgpQ_vb8QqjnJ';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

const TABLE_COUNT = 15;

const MENU = [
 {cat:'قهوه‌ها', items:[
  ['اسپرسو سینگل',140],['اسپرسو دبل',170],['آمریکانو سینگل',145],['آمریکانو دبل',175],
  ['اسپرسو عربیکا',200],['چیلی',175],['لته سینگل',210],['لته دبل',240],
  ['کاپوچینو سینگل شات',210],['کاپوچینو دبل شات',240],['کارامل ماکیاتو',255],['موکا',255],
  ['ترک',180],['آیس آمریکانو',150],['آیس لته',245],['هایپ اسپرسو',270],
  ['آفوگاتو',230],['آیس لته کارامل',260],['کافی کولا',255],['آیس کارامل ماکیاتو',260],['لمون کافی',280]]},
 {cat:'موج سوم', items:[
  ['کمکس تک کاپ',250],['کمکس دوبل کاپ',440],['سایفون تک کاپ',250],['سایفون دوبل کاپ',440],['فرنچ پرس',225]]},
 {cat:'گرم‌نوش', items:[
  ['چای ماسالا',260],['هات چاکلت',260],['هات فندقی',280],['وایت چاکلت',260],
  ['شیر نسکافه',260],['شیرعسل دارچین',270],['هات نوتلا',285],['پینک چاکلت',280]]},
 {cat:'دمنوش‌ها', items:[
  ['عطر آرامش',155],['اسپایسی چای ترش',155],['سیب دارچین',175],['لیمو نعنا عسلی',165],
  ['لبخند یلدا',160],['راز بنفش',170],['دل آرام',150],['چای لیوانی',85],['چای با فرنچ پرس',110]]},
 {cat:'خوراک', items:[
  ['لازانیا گوشت',490],['لازانیا مرغ',460],['پنینی روبو اسپشیال',480],['پنینی چیکن آلفردو',455],
  ['پنینی گوشت',500],['ماشروم برگر',510],['برگر کلاسیک',420],['پاستا آلفردو',410],
  ['اسنک روبیک ۸ تکه',480],['اسنک روبیک ۶ تکه',370],['اسنک روبیک ۴ تکه',295],
  ['سیب‌زمینی با سس قارچ',370],['سیب‌زمینی مخصوص روبیک',480],['چیپس و پنیر',360],['سیب‌زمینی تنوری ساده',250]]},
 {cat:'سالاد', items:[['سالاد سزار',450]]},
 {cat:'میان‌وعده', items:[
  ['کرپ نوتلا',230],['کرپ بنفی',310],['کرپ موز توت‌فرنگی',295],['پنکیک نوتلا',230],
  ['پنکیک موز نوتلا',275],['پنکیک موز توت‌فرنگی',295],['پنکیک مخصوص با بستنی',340],
  ['مینی پنکیک ساده با چای',295],['مینی پنکیک مخصوص با بستنی',295],['کرپ مافین اسپشیال',300]]},
 {cat:'کیک روز', items:[['کیک شکلاتی',105,1],['کیک تریلیچه',150,1]]},
 {cat:'خنکی‌جات', items:[
  ['موروکو',190],['ملودی',200],['هانی‌بری',185],['الی',195],['سیما',180],
  ['موهیتو',150],['کرش موهیتو',180],['برنارد',195],['لیموناد',150]]},
 {cat:'بستنی', items:[
  ['روبو بامبی',225],['کیک بستنی ویژه',305],['کیک بستنی',225],['کیک بستنی شکلاتی',240],['کیک بستنی میوه‌ای',240]]},
 {cat:'سردنوش', items:[['طلای آرام',240],['عطر بهشت',195],['نفس آبی',195],['ماه چین',195]]},
 {cat:'شیک', items:[
  ['تروبانا',325],['لتو بری',325],['چوکونات',315],['پیناتلا',355],['پرشین شیک',330],
  ['شیک نوتلا',305],['شیک کره بادام‌زمینی',295],['شیک توت‌فرنگی',290],['شیک شکلات',285]]},
 {cat:'صبحانه', items:[
  ['سینی روبیک',400],['بشقاب انگلیسی',380],['سینی دلخواه',null],
  ['املت اسفناج',180],['املت قارچ و پنیر',220],['املت ایرانی',160]]}
];

let orders = [];          // همه سفارش‌ها از دیتابیس
let online = false;
let cart = [];
let currentTable = null;
let currentCat = MENU[0].cat;
let searchTerm = '';
let currentTab = 'tables';

const $ = s => document.querySelector(s);
const fmt = p => p==null ? 'توافقی' : (p*1000).toLocaleString('fa-IR')+' تومان';
const sum = arr => (arr||[]).reduce((n,i)=> n + (i.p==null ? 0 : i.p*i.qty), 0) * 1000;

/* ===== دریافت سفارش‌ها (هر ۳.۵ ثانیه) ===== */
async function fetchOrders(){
  try{
    const {data, error} = await sb.from('cafe_orders').select('*').order('id');
    if(error) throw error;
    orders = data || [];
    if(!online){ online = true; }
  }catch(e){ online = false; }
  const c = $('#conn');
  c.textContent = online ? '✅ متصل' : '🔴 بدون اتصال';
  c.className = online ? 'ok' : '';
  if(currentTab==='tables') renderTables();
  if(currentTab==='orders') renderOrders();
  const badge = orders.filter(o=>o.status!=='done').length;
  $('#ordersBadge').textContent = badge ? badge : '';
}

/* ===== تب‌ها ===== */
function showTab(name){
  currentTab = name;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('main > section').forEach(s=>s.classList.toggle('show', s.id==='tab-'+name));
  if(name==='tables') renderTables();
  if(name==='menu')   renderMenu();
  if(name==='orders') renderOrders();
}

/* ===== میزها ===== */
function renderTables(){
  const el = $('#tablesGrid'); el.innerHTML='';
  for(let i=1;i<=TABLE_COUNT;i++){
    const open = orders.filter(o=>o.table_id===i && o.status!=='done').length;
    const d = document.createElement('div');
    d.className = 'table-card' + (open?' busy':'') + (currentTable===i?' selected':'');
    d.innerHTML = `<b>میز ${i}</b><span>${open ? open+' سفارش فعال' : 'آزاد'}</span>`;
    d.onclick = ()=>{ currentTable=i; cart=[]; showTab('menu'); };
    el.appendChild(d);
  }
}

/* ===== منو ===== */
function renderMenu(){
  const bar = $('#tableBar');
  bar.innerHTML = currentTable
    ? `<span>میز فعال: <b>میز ${currentTable}</b></span><button onclick="currentTable=null;cart=[];renderMenu()">تغییر میز</button>`
    : `<span>⚠️ اول از تب «میزها» یک میز انتخاب کن</span>`;

  const cats = $('#cats'); cats.innerHTML='';
  MENU.forEach(g=>{
    const b=document.createElement('button');
    b.textContent=g.cat;
    b.className='cat'+(g.cat===currentCat?' active':'');
    b.onclick=()=>{ currentCat=g.cat; searchTerm=''; $('#search').value=''; renderMenu(); };
    cats.appendChild(b);
  });

  const grid=$('#menuGrid'); grid.innerHTML='';
  let groups = searchTerm
    ? MENU.filter(g=>g.items.some(i=>i[0].includes(searchTerm)))
    : [MENU.find(x=>x.cat===currentCat)];
  groups.forEach(g=>{
    g.items.filter(i=>i[0].includes(searchTerm)).forEach(i=>{
      const c=document.createElement('div'); c.className='item'+(i[2]?' unavail':'');
      const info=document.createElement('div');
      info.innerHTML=`<span class="iname">${i[0]}</span>${searchTerm?`<span class="icat">${g.cat}</span>`:''}<span class="iprice">${fmt(i[1])}</span>`;
      c.appendChild(info);
      if(i[2]){ const s=document.createElement('span'); s.className='soldout'; s.textContent='ناموجود'; c.appendChild(s); }
      else{
        const btn=document.createElement('button'); btn.textContent='+'; btn.onclick=()=>addToCart(i[0],i[1]);
        c.appendChild(btn);
      }
      grid.appendChild(c);
    });
  });
  renderCart();
}

/* ===== سبد ===== */
function addToCart(name, price){
  if(!currentTable){ alert('اول یک میز انتخاب کن'); showTab('tables'); return; }
  const it = cart.find(i=>i.name===name);
  it ? it.qty++ : cart.push({name, p:price, qty:1});
  renderCart();
}
function changeQty(name, delta){
  const i = cart.findIndex(x=>x.name===name);
  if(i<0) return;
  cart[i].qty += delta;
  if(cart[i].qty<=0) cart.splice(i,1);
  renderCart();
}
function renderCart(){
  const el=$('#cartItems');
  if(!cart.length){
    el.innerHTML='<p class="muted">سبد خالی است</p>';
    $('#submitBtn').disabled=true;
    return;
  }
  el.innerHTML='';
  cart.forEach(i=>{
    const r=document.createElement('div'); r.className='cart-row';
    const t=document.createElement('div');
    t.innerHTML=`<span>${i.name}</span><small>${i.p==null?'':fmt(i.p*i.qty)}</small>`;
    const q=document.createElement('span'); q.className='qty';
    const minus=document.createElement('button'); minus.textContent='−'; minus.onclick=()=>changeQty(i.name,-1);
    const plus=document.createElement('button'); plus.textContent='+'; plus.onclick=()=>changeQty(i.name,1);
    q.append(minus, document.createTextNode(i.qty), plus);
    r.append(t,q);
    el.appendChild(r);
  });
  const tot=document.createElement('div'); tot.className='cart-row'; tot.id='totalRow';
  tot.innerHTML=`<span>جمع کل</span><span>${sum(cart).toLocaleString('fa-IR')} تومان</span>`;
  el.appendChild(tot);
  $('#submitBtn').disabled=false;
}

/* ===== ثبت سفارش در دیتابیس ===== */
async function submitOrder(){
  if(!currentTable || !cart.length) return;
  const btn=$('#submitBtn'); btn.disabled=true; btn.textContent='در حال ثبت...';
  const {error} = await sb.from('cafe_orders').insert({
    table_id: currentTable,
    items: cart,
    note: $('#orderNote').value.trim(),
    status: 'new'
  });
  btn.disabled=false; btn.textContent='ثبت سفارش';
  if(error){ alert('خطا در ثبت! اینترنت را چک کن و دوباره بزن.'); renderCart(); return; }
  cart=[]; $('#orderNote').value='';
  await fetchOrders();
  showTab('orders');
}

/* ===== سفارش‌ها ===== */
function renderOrders(){
  const el=$('#ordersList'); el.innerHTML='';
  const byTable = {};
  orders.forEach(o=>{ (byTable[o.table_id] = byTable[o.table_id] || []).push(o); });
  const tids = Object.keys(byTable).sort((a,b)=>a-b);
  if(!tids.length){ el.innerHTML='<p class="muted">هنوز سفارشی ثبت نشده است.</p>'; return; }
  tids.forEach(tid=>{
    const list = byTable[tid];
    const box=document.createElement('div'); box.className='order-box';
    const allDone = list.every(o=>o.status==='done');
    const h=document.createElement('h3');
    h.innerHTML=`<span>🪑 میز ${tid}</span>`;
    if(allDone){
      const f=document.createElement('button'); f.className='free'; f.textContent='آزادسازی میز';
      f.onclick=()=>freeTable(tid);
      h.appendChild(f);
    }
    box.appendChild(h);
    list.forEach(o=>box.appendChild(orderCard(o)));
    el.appendChild(box);
  });
}
function orderCard(o){
  const labels={new:'🆕 جدید', preparing:'⏳ در حال آماده‌سازی', done:'✅ تحویل شد'};
  const nextBtn={new:'شروع آماده‌سازی', preparing:'تحویل شد ✅', done:null};
  const d=document.createElement('div'); d.className='order status-'+o.status;
  const time = new Date(o.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
  d.innerHTML=`<div class="ohead"><b>سفارش #${o.id}</b><span>${time}</span></div>
    <ul>${(o.items||[]).map(i=>`<li><span>${i.name} × ${i.qty}</span><span>${i.p==null?'توافقی':fmt(i.p*i.qty)}</span></li>`).join('')}</ul>
    ${o.note?`<p class="note">📝 ${o.note}</p>`:''}
    <div class="ototal"><span>جمع کل</span><span>${sum(o.items).toLocaleString('fa-IR')} تومان</span></div>
    <span class="badge">${labels[o.status]||o.status}</span>`;
  if(nextBtn[o.status]){
    const b=document.createElement('button'); b.textContent=nextBtn[o.status];
    b.onclick=()=>advance(o.id, o.status);
    d.appendChild(b);
  }
  return d;
}
async function advance(id, status){
  const next = status==='new' ? 'preparing' : 'done';
  await sb.from('cafe_orders').update({status: next}).eq('id', id);
  fetchOrders();
}
async function freeTable(tid){
  if(!confirm('همه سفارش‌های میز '+tid+' پاک شود؟')) return;
  await sb.from('cafe_orders').delete().eq('table_id', tid);
  fetchOrders();
}

/* ===== رویدادها ===== */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$('#submitBtn').onclick=submitOrder;
$('#search').oninput=e=>{ searchTerm=e.target.value.trim(); renderMenu(); };
$('#resetBtn').onclick=async()=>{
  if(!confirm('همه سفارش‌های امروز از دیتابیس پاک شود؟')) return;
  await sb.from('cafe_orders').delete().neq('id', 0);
  fetchOrders();
};
fetchOrders();
setInterval(fetchOrders, 3500);
showTab('tables');
</script>
</body>
</html>
